ate</text><rect x="79.3" y="161.5" width="76.9" height="32.0" rx="16" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="117.8" y="182.5" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">+ 2 ATP</text><text x="117.8" y="228.3" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">lactate</text><text x="117.8" y="246.3" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">dehydrogenase</text><text x="117.8" y="264.3" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(NADH → NAD<tspan dy="-0.5em" font-size="70%">+</tspan><tspan dy="0.35em">)</tspan></text><text x="117.8" y="144.3" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glycolysis</text><rect x="440.1" y="93.5" width="76.9" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="478.5" y="114.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Glucose</text><rect x="440.1" y="263.5" width="76.9" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="478.5" y="284.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Lactate</text><rect x="625.1" y="93.5" width="76.9" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="663.5" y="114.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Glucose</text><rect x="621.1" y="178.5" width="84.7" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="663.5" y="199.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Pyruvate</text><rect x="625.1" y="263.5" width="76.9" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="663.5" y="284.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Lactate</text><rect x="773.4" y="161.5" width="131.8" height="32.0" rx="16" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="839.3" y="182.5" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">– 6 ATP equiv.</text><text x="839.3" y="144.3" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">gluconeogenesis</text><text x="839.3" y="228.3" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">lactate</text><text x="839.3" y="246.3" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">dehydrogenase</text><text x="839.3" y="264.3" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(NAD<tspan dy="-0.5em" font-size="70%">+</tspan><tspan dy="0.35em"> → NADH)</tspan></text><rect x="118.5" y="348.5" width="720.0" height="32.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="478.5" y="369.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Net per turn: 2 ATP made in muscle, 6 spent in liver → the body pays 4 ATP; the liver carries the cost</text></svg>