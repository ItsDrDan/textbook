<svg data-printfix="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 957 457" width="957" height="457" role="img" aria-label="The Cori cycle between muscle and liver. In working muscle, glucose goes through glycolysis to pyruvate, gaining 2 ATP, and under low oxygen pyruvate is reduced to lactate by lactate dehydrogenase. Lactate leaves in the blood and reaches the liver, where lactate dehydrogenase oxidizes it back to pyruvate, gluconeogenesis rebuilds glucose at a cost of 6 ATP equivalents, and glucose returns to the blood for the muscle to use again. Each turn costs the body 4 ATP overall and moves the energy burden from muscle to liver."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><rect x="1.5" y="20" width="362" height="298" rx="16" fill="#f1f8f3" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="13.5" y="40" font-size="13" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Muscle (working, low O₂)</text><rect x="390" y="20" width="177" height="298" rx="16" fill="#fbeeee" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="402" y="40" font-size="13" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Blood</text><rect x="593.5" y="20" width="361.9999999999999" height="298" rx="16" fill="#fdf6f0" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="605.5" y="40" font-size="13" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Liver</text><path d="M293.5 129.5 L293.5 174.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M293.5 174.5 L288.7 164.6 L298.3 164.6 Z" fill="#2d3f4b"/><path d="M293.5 214.5 L293.5 259.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M293.5 259.5 L288.7 249.6 L298.3 249.6 Z" fill="#2d3f4b"/><path 