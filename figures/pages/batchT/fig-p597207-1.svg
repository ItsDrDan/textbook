<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1107 432" width="1107" height="432" role="img" aria-label="Flow of dietary fat digestion and absorption. In the small intestine, bile salts emulsify large fat droplets into small ones; pancreatic lipase, a hydrolase, hydrolyzes each triacylglycerol to two fatty acids and a 2-monoacylglycerol; these form micelles with bile salts and are absorbed into intestinal cells, where triacylglycerols are rebuilt and packaged into chylomicrons that travel through lymph to the blood. At capillaries, lipoprotein lipase hydrolyzes the triacylglycerols again, releasing fatty acids to muscle (for energy) and adipose tissue (for storage)."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><rect x="20" y="20" width="411.25" height="332" rx="16" fill="#fdf8ef" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="32" y="40" font-size="13" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">small intestine (lumen)</text><rect x="299.5" y="20" width="357.5" height="332" rx="16" fill="#eef5fb" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="311.5" y="40" font-size="13" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">intestinal cell</text><rect x="557.5" y="20" width="443.4999999999999" height="332" rx="16" fill="#f5f9f7" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="569.5" y="40" font-size="13" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">lymph → blood → tissues</text><path d="M220.3 136.0 L220.3 176.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M220.3 176.0 L215.5 166.1 L225.0 166.1 Z" fill="#2d3f4b"/><path d="M220.3 236.0 L220.3 276.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M220.3 276.0 L215.5 266.1 L225.0 266.1 Z" fill="#2d3f4b"/><path d="M310.9 306.0 L391.9 306.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M391.9 306.0 L381.9 310.8 L381.9 301.2 Z" fill="#2d3f4b"/><path d="M478.3 276.0 L478.3 236.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M478.3 236.0 L483.0 245.9 L473.5 245.9 Z" fill="#2d3f4b"/><path d="M478.3 176.0 L478.3 136.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M478.3 136.0 L483.0 145.9 L473.5 145.9 Z" fill="#2d3f4b"/><path d="M547.9 106.0 L713.9 106.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M713.9 106.0 L703.9 110.8 L703.9 101.2 Z" fill="#2d3f4b"/><path d="M779.3 136.0 L779.3 176.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M779.3 176.0 L774.5 166.1 L784.0 166.1 Z" fill="#2d3f4b"/><path d="M779.3 236.0 L779.3 276.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M779.3 276.0 L774.5 266.1 L784.0 266.1 Z" fill="#2d3f4b"/><rect x="142.1" y="80.0" width="156.4" height="52.0" rx="10" fill="#f2e8f7" stroke="#b48cc8" stroke-width="2"/><text x="220.3" y="101.9" text-anchor="middle" font-size="15" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">dietary</text><text x="220.3" y="120.9" text-anchor="middle" font-size="15" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">triacylglycerols</text><rect x="142.1" y="180.0" width="156.4" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="220.3" y="201.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">small emulsified</text><text x="220.3" y="220.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">droplets</text><rect x="133.6" y="280.0" width="173.2" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="220.3" y="301.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">2 fatty acids +</text><text x="220.3" y="320.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">2-monoacylglycerol</text><rect x="395.9" y="280.0" width="164.8" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="478.3" y="301.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">micelles</text><text x="478.3" y="320.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(with bile salts)</text><rect x="404.3" y="180.0" width="148.0" height="52.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="478.3" y="201.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">TAG rebuilt</text><text x="478.3" y="220.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">inside the cell</text><rect x="412.6" y="80.0" width="131.2" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="478.3" y="101.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">chylomicrons</text><text x="478.3" y="120.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(lipoprotein)</text><rect x="717.9" y="80.0" width="122.8" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="779.3" y="101.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">chylomicrons</text><text x="779.3" y="120.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">in blood</text><rect x="692.6" y="180.0" width="173.2" height="52.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="779.3" y="201.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">capillary wall:</text><text x="779.3" y="220.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">lipoprotein lipase</text><rect x="663.3" y="280.0" width="232.0" height="52.0" rx="26" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="779.3" y="301.9" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">fatty acids → muscle</text><text x="779.3" y="320.9" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(burn) or adipose (store)</text><text x="962.0" y="121.4" text-anchor="middle" font-size="15" font-weight="600" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif"> </text><rect x="226.3" y="138.9" width="77.2" height="34.2" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="264.9" y="151.4" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">bile salts</text><text x="264.9" y="166.6" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(emulsify)</text><rect x="226.3" y="238.9" width="124.2" height="34.2" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="288.4" y="251.4" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">pancreatic lipase</text><text x="288.4" y="266.6" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(hydrolase) + H₂O</text><rect x="319.5" y="284.0" width="63.8" height="18.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="351.4" y="296.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">micelles</text><rect x="408.5" y="247.0" width="63.8" height="18.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="440.4" y="259.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">absorbed</text><rect x="408.5" y="147.0" width="63.8" height="18.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="440.4" y="159.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">packaged</text><rect x="582.2" y="84.0" width="97.4" height="18.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="630.9" y="96.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">lymph → blood</text><rect x="785.3" y="138.9" width="83.9" height="34.2" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="827.2" y="151.4" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">hydrolysis</text><text x="827.2" y="166.6" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(hydrolase)</text><rect x="785.3" y="247.0" width="57.0" height="18.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="813.8" y="259.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">release</text></svg>