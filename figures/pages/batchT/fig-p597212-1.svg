<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1032 532" width="1032" height="532" role="img" aria-label="Fat storage in an adipocyte after a meal. Chylomicrons from the gut and VLDL from the liver carry triacylglycerol in the blood; lipoprotein lipase on the capillary wall hydrolyzes it and the fatty acids enter the adipocyte, where they are activated to fatty acyl-CoA. Blood glucose enters through GLUT4 transporters and is converted by glycolysis to DHAP and then to glycerol 3-phosphate. Three fatty acyl-CoA are esterified to glycerol 3-phosphate to make triacylglycerol, which is stored in the lipid droplet. Insulin activates lipoprotein lipase and GLUT4 and turns hormone-sensitive lipase off."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><rect x="20" y="20" width="412" height="492" rx="16" fill="#fdf4f3" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="32" y="40" font-size="15.5" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">blood / capillary</text><rect x="320" y="215" width="611.9999999999999" height="297" rx="16" fill="#fdf8ef" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="332" y="235" font-size="15.5" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">adipocyte (fat cell)</text><path d="M216.0 116.5 L216.0 151.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M216.0 151.0 L211.2 141.1 L220.8 141.1 Z" fill="#2d3f4b"/><path d="M315.0 181.0 L401.2 181.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M401.2 181.0 L391.3 185.8 L391.3 176.2 Z" fill="#2d3f4b"/><path d="M590.8 181.0 L684.8 181.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M684.8 181.0 L674.9 185.8 L674.9 176.2 Z" fill="#2d3f4b"/><path d="M746.0 201.5 L746.0 295.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M746.0 295.5 L741.2 285.6 L750.8 285.6 Z" fill="#2d3f4b"/><path d="M746.0 336.5 L746.0 396.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M746.0 396.0 L741.2 386.1 L750.8 386.1 Z" fill="#2d3f4b"/><path d="M285.6 316.0 L451.6 316.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M451.6 316.0 L441.7 320.8 L441.7 311.2 Z" fill="#2d3f4b"/><path d="M496.0 336.5 L496.0 405.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.0 405.5 L491.2 395.6 L500.8 395.6 Z" fill="#2d3f4b"/><path d="M595.0 426.0 L626.0 426.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M626.0 426.0 L616.1 430.8 L616.1 421.2 Z" fill="#2d3f4b"/><path d="M586.6 126.0 L545.4 151.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M545.4 151.0 L551.4 141.8 L556.4 149.9 Z" fill="#2d3f4b"/><path d="M636.0 126.0 L636.0 256.0 L540.4 297.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M540.4 297.0 L547.6 288.7 L551.4 297.5 Z" fill="#2d3f4b"/><rect x="154.6" y="79.5" width="122.8" height="33.0" rx="10" fill="#f2e8f7" stroke="#b48cc8" stroke-width="2"/><text x="216.0" y="101.4" text-anchor="middle" font-size="15" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">after a meal</text><rect x="121.0" y="155.0" width="190.0" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="216.0" y="176.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">chylomicrons / VLDL</text><text x="216.0" y="195.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(carry TAG in blood)</text><rect x="405.2" y="155.0" width="181.6" height="52.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="496.0" y="176.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">lipoprotein lipase</text><text x="496.0" y="195.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(on capillary wall)</text><rect x="688.8" y="164.5" width="114.4" height="33.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="746.0" y="186.4" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">fatty acids</text><rect x="676.2" y="299.5" width="139.6" height="33.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="746.0" y="321.4" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">fatty acyl-CoA</text><rect x="630.0" y="400.0" width="232.0" height="52.0" rx="26" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="746.0" y="421.9" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">triacylglycerol</text><text x="746.0" y="440.9" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(stored in lipid droplet)</text><rect x="150.4" y="299.5" width="131.2" height="33.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="216.0" y="321.4" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">blood glucose</text><rect x="455.6" y="299.5" width="80.8" height="33.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="496.0" y="321.4" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glucose</text><rect x="401.0" y="409.5" width="190.0" height="33.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="496.0" y="431.4" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glycerol 3-phosphate</text><rect x="507.4" y="70.0" width="257.2" height="52.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="636.0" y="91.9" text-anchor="middle" font-size="15" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">insulin ↑: activates LPL and</text><text x="636.0" y="110.9" text-anchor="middle" font-size="15" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">GLUT4; switches HSL off</text><rect x="599.2" y="159.0" width="77.2" height="18.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="637.8" y="171.0" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">hydrolysis</text><rect x="752.0" y="231.5" width="137.7" height="34.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="820.8" y="242.7" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">activation (ligase)</text><text x="820.8" y="260.3" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">ATP → AMP</text><rect x="752.0" y="349.3" width="110.8" height="34.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="807.4" y="360.5" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">esterification</text><text x="807.4" y="378.1" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(3 acyl groups)</text><rect x="313.2" y="279.0" width="110.8" height="34.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="368.6" y="290.2" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">GLUT4</text><text x="368.6" y="307.8" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(needs insulin)</text><rect x="502.0" y="354.0" width="131.0" height="34.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="567.5" y="365.2" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glycolysis → DHAP</text><text x="567.5" y="382.8" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">→ reduction (NADH)</text></svg>