ht="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">lipoxygenase</text><rect x="241.6" y="35.0" width="178.8" height="50.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="331.0" y="56.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">NSAIDs (aspirin,</text><text x="331.0" y="74.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">ibuprofen) block COX</text><rect x="164.4" y="154.0" width="90.1" height="17.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="209.4" y="165.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">phospholipase</text></svg>