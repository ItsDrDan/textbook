<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1082 296" width="1082" height="296" role="img" aria-label="Eicosanoid overview. Membrane phospholipids release arachidonic acid (20:4 omega-6). The cyclooxygenase (COX) enzymes convert it to prostaglandins (inflammation, pain, fever, gastric protection) and thromboxanes (platelet aggregation); lipoxygenase converts it to leukotrienes (bronchoconstriction, asthma). NSAIDs such as aspirin and ibuprofen block COX."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><path d="M165.5 148.0 L253.3 148.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M253.3 148.0 L243.4 152.8 L243.4 143.2 Z" fill="#2d3f4b"/><path d="M408.7 130.2 L445.8 121.8" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M445.8 121.8 L437.2 128.6 L435.1 119.3 Z" fill="#2d3f4b"/><path d="M601.2 82.3 L611.1 79.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M611.1 79.5 L602.9 86.8 L600.3 77.6 Z" fill="#2d3f4b"/><path d="M601.2 125.7 L619.0 130.7" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M619.0 130.7 L608.1 132.6 L610.7 123.4 Z" fill="#2d3f4b"/><path d="M394.4 177.0 L479.8 216.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M479.8 216.0 L468.8 216.2 L472.7 207.5 Z" fill="#2d3f4b"/><path d="M585.5 236.0 L619.0 236.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M619.0 236.0 L609.0 240.8 L609.0 231.2 Z" fill="#2d3f4b"/><path d="M750.9 60.0 L791.6 60.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M791.6 60.0 L781.7 64.8 L781.7 55.2 Z" fill="#8a97a6"/><path d="M743.0 148.0 L815.1 148.0