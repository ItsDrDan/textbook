ter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >AUG</text><text x="879.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >GGU</text><text x="925.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >GAA</text><text x="971.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >AAG</text><text x="895.0" y="248.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="900" fill="#5b4790" text-anchor="middle" >P</text><text x="1001.0" y="248.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="900" fill="#5b4790" text-anchor="middle" >A</text><rect x="909.0" y="208" width="32" height="70" rx="8" fill="#ffffff" stroke="#23704f" stroke-width="2.4"/><text x="925.0" y="270.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.1" font-weight="800" fill="#23704f" text-anchor="middle" >CUU</text><line x1="925.0" y1="208" x2="925.0" y2="196" stroke="#23704f" stroke-width="2.4"/><circle cx="925.0" cy="182" r="14" fill="#c0392b"/><text x="925.0" y="186.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.1" font-weight="900" fill="#ffffff" text-anchor="middle" >Glu</text><circle cx="925.0" cy="154" r="14" fill="#2f5fc4"/><text x="925.0" y="158.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.1" font-weight="900" fill="#ffffff" text-anchor="middle" >Gly</text><circle cx="925.0" cy="126" r="14" fill="#7a8a99"/><text x="925.0" y="130.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.1" font-weight="900" fill="#ffffff" text-anchor="middle" >Met</text><g opacity="0.55"><rect x="845.0" y="208" width="32" height="70" rx="8" fill="#ffffff" stroke="#23704