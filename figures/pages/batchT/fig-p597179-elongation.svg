<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 380" width="1140" height="380" style="max-width:100%;height:auto" role="img" aria-label="One elongation cycle of translation on the mRNA 5 prime AUG GGU GAA AAG 3 prime. Panel 1: the ribosome covers codons GGU and GAA. The P site holds the tRNA with anticodon CCA carrying the growing chain Met-Gly; a tRNA with anticodon CUU carrying Glu enters the A site at codon GAA. Panel 2: a peptide bond forms and the chain Met-Gly is moved onto Glu, so the A-site tRNA now carries Met-Gly-Glu and the P-site tRNA is empty. Panel 3: translocation; the ribosome moves one codon toward the 3 prime end, the empty tRNA leaves, the tRNA carrying Met-Gly-Glu is now in the P site, and the A site is open at codon AAG for the next tRNA."><rect width="100%" height="100%" fill="#ffffff"/><line x1="30" y1="300" x2="254" y2="300" stroke="#2d3f4b" stroke-width="3"/><text x="26.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.1" font-weight="800" fill="#5a6478" text-anchor="end" >5&#8242;</text><text x="258.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.1" font-weight="800" fill="#5a6478" text-anchor="start" >3&#8242;</text><rect x="78" y="286" width="128" height="46" rx="20" fill="#e9e3f5" fill-opacity="0.35" stroke="#5b4790" stroke-width="2"/><rect x="54" y="150" width="176" height="124" rx="40" fill="#e9e3f5" fill-opacity="0.55" stroke="#5b4790" stroke-width="2"/><text x="73.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >AUG</text><text x="119.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >GGU</text><text x="165.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >GAA</text><text x="211.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >AAG</text><text x="89.0" y="248.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="900" fill="#5b4790" text-anchor="middle" >P</text><text x="195.0" y="248.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="900" fill="#5b4790" text-anchor="middle" >A</text><rect x="103.0" y="208" width="32" height="70" rx="8" fill="#ffffff" stroke="#23704f" stroke-width="2.4"/><text x="119.0" y="270.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.1" font-weight="800" fill="#23704f" text-anchor="middle" >CCA</text><line x1="119.0" y1="208" x2="119.0" y2="196" stroke="#23704f" stroke-width="2.4"/><circle cx="119.0" cy="182" r="14" fill="#2f5fc4"/><text x="119.0" y="186.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.1" font-weight="900" fill="#ffffff" text-anchor="middle" >Gly</text><circle cx="119.0" cy="154" r="14" fill="#7a8a99"/><text x="119.0" y="158.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.1" font-weight="900" fill="#ffffff" text-anchor="middle" >Met</text><rect x="149.0" y="208" width="32" height="70" rx="8" fill="#ffffff" stroke="#23704f" stroke-width="2.4"/><text x="165.0" y="270.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.1" font-weight="800" fill="#23704f" text-anchor="middle" >CUU</text><line x1="165.0" y1="208" x2="165.0" y2="196" stroke="#23704f" stroke-width="2.4"/><circle cx="165.0" cy="182" r="14" fill="#c0392b"/><text x="165.0" y="186.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.1" font-weight="900" fill="#ffffff" text-anchor="middle" >Glu</text><text x="150.0" y="28.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="900" fill="#2d3f4b" text-anchor="middle" >1  A new tRNA enters the A site</text><line x1="410" y1="300" x2="634" y2="300" stroke="#2d3f4b" stroke-width="3"/><text x="406.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.1" font-weight="800" fill="#5a6478" text-anchor="end" >5&#8242;</text><text x="638.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.1" font-weight="800" fill="#5a6478" text-anchor="start" >3&#8242;</text><rect x="458" y="286" width="128" height="46" rx="20" fill="#e9e3f5" fill-opacity="0.35" stroke="#5b4790" stroke-width="2"/><rect x="434" y="150" width="176" height="124" rx="40" fill="#e9e3f5" fill-opacity="0.55" stroke="#5b4790" stroke-width="2"/><text x="453.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >AUG</text><text x="499.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >GGU</text><text x="545.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >GAA</text><text x="591.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >AAG</text><text x="469.0" y="248.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="900" fill="#5b4790" text-anchor="middle" >P</text><text x="575.0" y="248.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="900" fill="#5b4790" text-anchor="middle" >A</text><rect x="483.0" y="208" width="32" height="70" rx="8" fill="#ffffff" stroke="#23704f" stroke-width="2.4"/><text x="499.0" y="270.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.1" font-weight="800" fill="#23704f" text-anchor="middle" >CCA</text><line x1="499.0" y1="208" x2="499.0" y2="196" stroke="#23704f" stroke-width="2.4"/><rect x="529.0" y="208" width="32" height="70" rx="8" fill="#ffffff" st