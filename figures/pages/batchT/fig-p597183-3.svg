<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1082 344" width="1082" height="344" role="img" aria-label="Flow diagram of how the three RNAs cooperate. A gene is transcribed by RNA polymerase into mRNA, which carries the codons to the ribosome made of rRNA and proteins. An amino acid and its tRNA are joined by aminoacyl-tRNA synthetase, using ATP, to form an aminoacyl-tRNA, which enters the ribosome, where its anticodon pairs with a codon. The ribosome's peptidyl transferase, catalyzed by rRNA, adds the amino acid to the growing polypeptide."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><path d="M160.5 55.0 L317.4 55.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M317.4 55.0 L307.5 59.8 L307.5 50.2 Z" fill="#2d3f4b"/><path d="M414.6 64.5 L559.6 92.8" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M559.6 92.8 L549.0 95.5 L550.8 86.2 Z" fill="#2d3f4b"/><path d="M160.5 163.7 L302.4 181.7" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M302.4 181.7 L291.9 185.2 L293.1 175.7 Z" fill="#2d3f4b"/><path d="M164.7 226.6 L302.4 209.1" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M302.4 209.1 L293.1 215.1 L291.9 205.6 Z" fill="#2d3f4b"/><path d="M492.4 165.4 L563.4 139.6" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M563.4 139.6 L555.7 147.5 L552.5 138.5 Z" fill="#2d3f4b"/><path d="M732.4 109.6 L829.8 109.6" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M829.8 109.6 L819.9 114.4 L819.9 104.8 Z" fill="#2d3f4b"/><rect x="50.5" y="38.5" width="106.0" height="33.0" rx="10" fill="#f2e8f7" stroke="#b48cc8" stroke-width="2"/><text x="103.5" y="60.4" text-anchor="middle" font-size="16" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">DNA (gene)</text><rect x="321.4" y="29.0" width="89.2" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="366.0" y="50.3" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">mRNA</text><text x="366.0" y="70.5" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(codons)</text><rect x="563.6" y="83.6" width="164.8" height="52.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="646.0" y="104.9" text-anchor="middle" font-size="16" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">ribosome</text><text x="646.0" y="125.1" text-anchor="middle" font-size="16" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(rRNA + proteins)</text><rect x="833.8" y="83.6" width="114.4" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="891.0" y="104.9" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">growing</text><text x="891.0" y="125.1" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">polypeptide</text><rect x="50.5" y="139.9" width="106.0" height="33.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="103.5" y="161.8" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">amino acid</text><rect x="46.3" y="208.4" width="114.4" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="103.5" y="229.7" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">tRNA</text><text x="103.5" y="249.9" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(anticodon)</text><rect x="306.4" y="169.4" width="206.8" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="409.8" y="190.7" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">aminoacyl-tRNA</text><text x="409.8" y="210.9" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(amino acid at 3′ end)</text><text x="234.8" y="93.2" text-anchor="middle" font-size="16" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">transcription</text><text x="234.8" y="113.4" text-anchor="middle" font-size="16" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">RNA polymerase</text><text x="252.3" y="257.0" text-anchor="middle" font-size="16" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">aminoacyl-tRNA</text><text x="252.3" y="277.2" text-anchor="middle" font-size="16" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">synthetase</text><rect x="246.5" y="128.2" width="64.0" height="33.0" rx="16.5" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="278.5" y="150.1" text-anchor="middle" font-size="16" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">ATP</text><text x="891.0" y="175.1" text-anchor="middle" font-size="16" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">peptidyl transferase</text><text x="891.0" y="195.3" text-anchor="middle" font-size="16" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(catalyzed by rRNA)</text><rect x="572.0" y="177.2" width="148.0" height="52.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="646.0" y="198.5" text-anchor="middle" font-size="16" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">anticodon pairs</text><text x="646.0" y="218.7" text-anchor="middle" font-size="16" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">with codon</text></svg>