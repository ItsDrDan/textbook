<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 480" width="1220" height="480" style="max-width:100%;height:auto" role="img" aria-label="The citric acid cycle as a loop. Step 1, citrate synthase: acetyl CoA (2 carbons) and water join oxaloacetate (4 carbons) to make citrate (6 carbons), releasing CoA-SH. Step 2, aconitase: citrate is rearranged to isocitrate. Step 3, isocitrate dehydrogenase: NAD+ is reduced to NADH and CO2 leaves, giving alpha-ketoglutarate (5 carbons). Step 4, alpha-ketoglutarate dehydrogenase: NAD+ is reduced to NADH and CO2 leaves, giving succinyl CoA (4 carbons). Step 5, succinyl CoA synthetase: GDP and phosphate make GTP, giving succinate. Step 6, succinate dehydrogenase: FAD is reduced to FADH2, giving fumarate. Step 7, fumarase: water adds, giving malate. Step 8, malate dehydrogenase: NAD+ is reduced to NADH, regenerating oxaloacetate. Per turn: 2 CO2, 3 NADH, 1 FADH2 and 1 GTP."><rect width="100%" height="100%" fill="#ffffff"/><rect x="150" y="109.0" width="150" height="62" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="225.0" y="135.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Citrate</text><text x="225.0" y="154.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >(6 C)</text><rect x="420" y="109.0" width="160" height="62" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="500.0" y="135.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Isocitrate</text><text x="500.0" y="154.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >(6 C)</text><rect x="720" y="109.0" width="180" height="62" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="810.0" y="135.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >&#945;-Ketoglutarate</text><text x="810.0" y="154.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >(5 C)</text><rect x="1040" y="109.0" width="160" height="62" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="1120.0" y="135.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Succinyl CoA</text><text x="1120.0" y="154.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >(4 C)</text><rect x="1040" y="361.0" width="160" height="62" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="1120.0" y="387.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Succinate</text><text x="1120.0" y="406.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >(4 C)</text><rect x="740" y="361.0" width="140" height="62" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="810.0" y="387.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Fumarate</text><text x="810.0" y="406.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >(4 C)</text><rect x="440" y="361.0" width="140" height="62" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="510.0" y="387.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Malate</text><text x="510.0" y="406.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >(4 C)</text><rect x="150" y="361.0" width="150" height="62" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="225.0" y="387.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Oxaloacetate</text><text x="225.0" y="406.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2d3f4b" text-anchor="middle" >(4 C)</text><text x="20.0" y="32.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="900" fill="#5b4790" text-anchor="start" >One turn of the citric acid cycle (in the mitochondrial matrix)</text><line x1="306" y1="140" x2="403.0" y2="140.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M414 140 L403.0 146.1 L403.0 133.9 Z" fill="#2d3f4b"/><text x="360.0" y="128.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">2 aconitase</text><line x1="586" y1="140" x2="703.0" y2="140.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M714 140 L703.0 146.1 L703.0 133.9 Z" fill="#2d3f4b"/><text x="650.0" y="111.4" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">3 isocitrate</text><text x="650.0" y="128.6" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">dehydrogenase</text><rect x="586.0" y="161" width="128.0" height="26" rx="13" fill="#e3ecfb" stroke="#7d9bd6" stroke-width="1.6"/><text x="650.0" y="179.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f5fc4" text-anchor="middle" >NAD<tspan baseline-shift="super" font-size="10">+</tspan> &#8594; NADH</text><rect x="586.0" y="191" width="128.0" height="26" rx="13" fill="#eef1f5" stroke="#a9b4c2" stroke-width="1.6"/><text x="650.0" y="209.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#4f5a74" text-anchor="middle" >CO<tspan baseline-shift="sub" font-size="10">2</tspan> out</text><line x1="906" y1="140" x2="1023.0" y2="140.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M1034 140 L1023.0 146.1 L1023.0 133.9 Z" fill="#2d3f4b"/><text x="970.0" y="111.4" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">4 &#945;-ketoglutarate</text><text x="970.0" y="128.6" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">dehydrogenase</text><rect x="906.0" y="161" width="128.0" height="26" rx="13" fill="#e3ecfb" stroke="#7d9bd6" stroke-width="1.6"/><text x="970.0" y="179.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f5fc4" text-anchor="middle" >NAD<tspan baseline-shift="super" font-size="10">+</tspan> &#8594; NADH</text><rect x="906.0" y="191" width="128.0" height="26" rx="13" fill="#eef1f5" stroke="#a9b4c2" stroke-width="1.6"/><text x="970.0" y="209.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#4f5a74" text-anchor="middle" >CO<tspan baseline-shift="sub" font-size="10">2</tspan> out</text><line x1="1120" y1="173" x2="1120.0" y2="348.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M1120 359 L1114.0 348.0 L1126.0 348.0 Z" fill="#2d3f4b"/><text x="1106.0" y="235.4" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#5a6478" text-anchor="end" font-style="italic">5 succinyl CoA</text><text x="1106.0" y="252.6" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#5a6478" text-anchor="end" font-style="italic">synthetase</text><rect x="938.0" y="273" width="168.0" height="26" rx="13" fill="#fff3c4" stroke="#d4a72c" stroke-width="1.6"/><text x="1022.0" y="291.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#7a5d00" text-anchor="middle" >GDP + P<tspan baseline-shift="sub" font-size="10">i</tspan> &#8594; GTP</text><line x1="1034" y1="392" x2="897.0" y2="392.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M886 392 L897.0 385.9 L897.0 398.1 Z" fill="#2d3f4b"/><text x="960.0" y="347.4" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">6 succinate</text><text x="960.0" y="364.6" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">dehydrogenase</text><rect x="889.0" y="429" width="142.0" height="26" rx="13" fill="#e3ecfb" stroke="#7d9bd6" stroke-width="1.6"/><text x="960.0" y="447.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f5fc4" text-anchor="middle" >FAD &#8594; FADH<tspan baseline-shift="sub" font-size="10">2</tspan></text><line x1="734" y1="392" x2="597.0" y2="392.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M586 392 L597.0 385.9 L597.0 398.1 Z" fill="#2d3f4b"/><text x="660.0" y="364.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">7 fumarase</text><rect x="589.0" y="429" width="142.0" height="26" rx="13" fill="#eef1f5" stroke="#a9b4c2" stroke-width="1.6"/><text x="660.0" y="447.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#4f5a74" text-anchor="middle" >+ H<tspan baseline-shift="sub" font-size="10">2</tspan>O</text><line x1="434" y1="392" x2="317.0" y2="392.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M306 392 L317.0 385.9 L317.0 398.1 Z" fill="#2d3f4b"/><text x="370.0" y="347.4" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">8 malate</text><text x="370.0" y="364.6" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">dehydrogenase</text><rect x="299.0" y="429" width="142.0" height="26" rx="13" fill="#e3ecfb" stroke="#7d9bd6" stroke-width="1.6"/><text x="370.0" y="447.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f5fc4" text-anchor="middle" >NAD<tspan baseline-shift="super" font-size="10">+</tspan> &#8594; NADH</text><line x1="225" y1="359" x2="225.0" y2="184.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M225 173 L231.1 184.0 L218.9 184.0 Z" fill="#2d3f4b"/><rect x="14" y="237.0" width="110" height="58" rx="10" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="69.0" y="261.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#80601a" text-anchor="middle" >Acetyl CoA</text><text x="69.0" y="280.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#80601a" text-anchor="middle" >(2 C)</text><line x1="126" y1="266" x2="208.0" y2="266.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M219 266 L208.0 272.1 L208.0 259.9 Z" fill="#2d3f4b"/><text x="238.0" y="236.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#5a6478" text-anchor="start" font-style="italic">1 citrate synthase</text><rect x="235.0" y="259" width="170.0" height="26" rx="13" fill="#eef1f5" stroke="#a9b4c2" stroke-width="1.6"/><text x="320.0" y="277.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#4f5a74" text-anchor="middle" >+ H<tspan baseline-shift="sub" font-size="10">2</tspan>O, CoA&#8211;SH out</text><rect x="470" y="232" width="330" height="96" rx="12" fill="#efeaf8" stroke="#5b4790" stroke-width="2"/><text x="635.0" y="260.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#5b4790" text-anchor="middle" >Per acetyl CoA (one turn):</text><text x="635.0" y="286.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="900" fill="#5b4790" text-anchor="middle" >2 CO<tspan baseline-shift="sub" font-size="10">2</tspan> + 3 NADH</text><text x="635.0" y="312.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="900" fill="#5b4790" text-anchor="middle" >+ 1 FADH<tspan baseline-shift="sub" font-size="10">2</tspan> + 1 GTP</text></svg>