<svg data-printfix="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1182 317" width="1182" height="317" role="img" aria-label="Glycerol metabolism in the liver: glycerol is phosphorylated by glycerol kinase (a transferase, using ATP) to glycerol 3-phosphate, which glycerol-3-phosphate dehydrogenase (an oxidoreductase, NAD+ to NADH) oxidizes to dihydroxyacetone phosphate, a glycolysis intermediate that can go on to pyruvate or be used for gluconeogenesis to glucose."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><path d="M248.6 139.5 L377.0 139.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M377.0 139.5 L367.1 144.3 L367.1 134.7 Z" fill="#2d3f4b"/><path d="M575.0 139.5 L762.0 139.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M762.0 139.5 L752.1 144.3 L752.1 134.7 Z" fill="#2d3f4b"/><path d="M820.6 160.0 L890.4 223.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M890.4 223.5 L879.9 220.4 L886.3 213.3 Z" fill="#8a97a6"/><path d="M762.0 157.7 L631.6 223.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M631.6 223.5 L638.3 214.8 L642.6 223.3 Z" fill="#8a97a6"/><rect x="155.4" y="123.0" width="89.2" height="33.0" rx="10" fill="#f2e8f7" stroke="#b48cc8" stroke-width="2"/><text x="200.0" y="144.9" text-anchor="middle" font-size="15" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glycerol</text><rect x="381.0" y="123.0" width="190.0" height="33.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="476.0" y="144.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glycerol 3-phosphate</text><rect x="766.0" y="123.0" width="64.0" height="33.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="798.0" y="144.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">DHAP</text><rect x="289.2" y="56.5" width="97.6" height="33.0" rx="16.5" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="338.0" y="78.4" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">ATP → ADP</text><rect x="558.8" y="56.5" width="156.4" height="33.0" rx="16.5" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="637.0" y="78.4" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">NAD<tspan dy="-0.5em" font-size="70%">+</tspan><tspan dy="0.35em"> → NADH + H</tspan><tspan dy="-0.5em" font-size="70%">+</tspan></text><rect x="813.8" y="227.5" width="198.4" height="33.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="913.0" y="249.4" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glycolysis → pyruvate</text><rect x="475.0" y="227.5" width="232.0" height="33.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="591.0" y="249.4" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">gluconeogenesis → glucose</text><rect x="257.4" y="151.3" width="110.8" height="36.3" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="312.8" y="164.3" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glycerol kinase</text><text x="312.8" y="180.7" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(transferase)</text><rect x="576.1" y="151.3" width="184.7" height="36.3" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="668.5" y="164.3" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glycerol-3-P dehydrogenase</text><text x="668.5" y="180.7" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(oxidoreductase)</text></svg>