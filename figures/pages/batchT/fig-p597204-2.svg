<svg data-printfix="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1082 372" width="1082" height="372" role="img" aria-label="The malate–aspartate shuttle. In the cytosol, NADH from glycolysis reduces oxaloacetate to malate (cytosolic malate dehydrogenase), regenerating NAD+. Malate crosses the inner mitochondrial membrane on a carrier. In the matrix, malate dehydrogenase re-oxidizes malate to oxaloacetate, producing matrix NADH that goes to Complex I for about 2.5 ATP. Oxaloacetate cannot cross the membrane, so a transaminase converts it to aspartate, which is carried back to the cytosol and transaminated back to oxaloacetate, completing the loop."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><rect x="20" y="20" width="502" height="332" rx="16" fill="#fff8e6" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="32" y="40" font-size="13" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Cytosol</text><rect x="395" y="20" width="292" height="332" rx="16" fill="#eef3f8" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="407" y="40" font-size="13" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Inner membrane</text><rect x="560" y="20" width="532" height="332" rx="16" fill="#f3fbf6" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="572" y="40" font-size="13" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Mitochondrial matrix</text><path d="M258.0 160.5 L352.5 160.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M352.5 160.5 L342.6 165.3 L342.6 155.7 Z" fill="#2d3f4b"/><path d="M293.5 113.0 L293.5 160.5 L352.5 160.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M352.5 160.5 L342.6 165.3 L342.6 155.7 Z" fill="#8a97a6"/><path d="M429.5 160.5 L498.6 160.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M498.6 160.5 L488.6 165.3 L488.6 155.7 Z" fill="#2d3f4b"/><path d="M583.4 160.5 L667.5 160.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M667.5 160.5 L657.6 165.3 L657.6 155.7 Z" fill="#2d3f4b"/><path d="M744.5 160.5 L839.0 160.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M839.0 160.5 L829.0 165.3 L829.0 155.7 Z" fill="#2d3f4b"/><path d="M744.5 160.5 L766.0 160.5 L766.0 104.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M766.0 104.0 L770.8 113.9 L761.2 113.9 Z" fill="#8a97a6"/><path d="M824.1 84.0 L903.2 84.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M903.2 84.0 L893.3 88.8 L893.3 79.2 Z" fill="#2d3f4b"/><path d="M901.0 180.5 L901.0 259.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M901.0 259.5 L896.2 249.6 L905.8 249.6 Z" fill="#2d3f4b"/><path d="M850.7 279.5 L591.3 279.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M591.3 279.5 L601.2 274.7 L601.2 284.3 Z" fill="#2d3f4b"/><path d="M490.7 279.5 L246.3 279.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M246.3 279.5 L256.2 274.7 L256.2 284.3 Z" fill="#2d3f4b"/><path d="M196.0 259.5 L196.0 180.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M196.0 180.5 L200.8 190.4 L191.2 190.4 Z" fill="#2d3f4b"/><rect x="138.0" y="144.5" width="116.1" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="196.0" y="165.5" text-anchor="middle" font-size="14" font-weight="700" fill="