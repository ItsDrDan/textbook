ly="Nunito,Inter,Helvetica,Arial,sans-serif">carrier</text><rect x="149.7" y="263.5" width="92.6" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="196.0" y="284.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">aspartate</text><rect x="215.9" y="59.0" width="155.3" height="50.0" rx="25" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="293.5" y="80.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">NADH → NAD<tspan dy="-0.5em" font-size="70%">+</tspan></text><text x="293.5" y="98.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(from glycolysis)</text><rect x="711.9" y="68.0" width="108.2" height="32.0" rx="16" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="766.0" y="89.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">NAD<tspan dy="-0.5em" font-size="70%">+</tspan><tspan dy="0.35em"> → NADH</tspan></text><rect x="907.2" y="59.0" width="92.6" height="50.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="953.5" y="80.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Complex I</text><text x="953.5" y="98.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">≈ 2.5 ATP</text><text x="758.5" y="220.3" text-anchor="middle" font-size="14" font-weight="600" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glutamate ↔ α-ketoglutarate</text><text x="758.5" y="238.3" text-anchor="middle" font-size="14" font-weight="600" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(amino group swap)</text><rect x="260.2" y="164.3" width