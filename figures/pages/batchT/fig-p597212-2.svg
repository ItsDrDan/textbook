<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 55 832 447" width="832" height="447" role="img" aria-label="Fat mobilization during fasting or stress. Glucagon (fasting) or epinephrine (stress, exercise) binds a receptor on the adipocyte, raising cyclic AMP, which activates protein kinase A. Protein kinase A phosphorylates hormone-sensitive lipase, switching it on; the lipase completely hydrolyzes stored triacylglycerol to fatty acids and glycerol. Fatty acids travel in the blood bound to albumin to muscle and liver for beta-oxidation; glycerol goes to the liver for gluconeogenesis. Low insulin keeps the lipase on."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><rect x="290" y="85" width="641.9999999999999" height="302" rx="16" fill="#fdf8ef" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="302" y="105" font-size="14.5" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">adipocyte (fat cell)</text><rect x="20" y="320" width="911.9999999999999" height="192" rx="16" fill="#fdf4f3" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="32" y="340" font-size="14.5" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">blood → tissues</text><path d="M196.0 106.5 L196.0 176.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M196.0 176.0 L191.2 166.1 L200.8 166.1 Z" fill="#2d3f4b"/><path d="M257.2 198.3 L395.8 181.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M395.8 181.0 L386.6 187.0 L385.4 177.5 Z" fill="#2d3f4b"/><path d="M476.2 176.0 L593.8 176.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M593.8 176.0 L583.9 180.8 L583.9 171.2 Z" fill="#2d3f4b"/><path d="M676.0 206.0 L676.0 256.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M676.0 256.0 L671.2 246.1 L680.8 246.1 Z" fill="#2d3f4b"/><path d="M543.4 286.0 L494.0 286.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.0 286.0 L503.9 281.2 L503.9 290.8 Z" fill="#2d3f4b"/><path d="M394.2 316.0 L357.8 366.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M357.8 366.0 L359.8 355.2 L367.5 360.8 Z" fill="#2d3f4b"/><path d="M492.4 316.0 L619.6 366.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M619.6 366.0 L608.7 366.8 L612.2 357.9 Z" fill="#2d3f4b"/><path d="M336.0 426.0 L336.0 431.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M336.0 431.0 L331.2 421.1 L340.8 421.1 Z" fill="#8a97a6"/><path d="M696.0 426.0 L696.0 431.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M696.0 431.0 L691.2 421.1 L700.8 421.1 Z" fill="#8a97a6"/><rect x="113.6" y="69.5" width="164.8" height="33.0" rx="10" fill="#f2e8f7" stroke="#b48cc8" stroke-width="2"/><text x="196.0" y="91.4" text-anchor="middle" font-size="15" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">fasting or stress</text><rect x="138.8" y="180.0" width="114.4" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="196.0" y="201.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glucagon or</text><text x="196.0" y="220.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">epinephrine</text><rect x="399.8" y="159.5" width="72.4" height="33.0" rx="16.5" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="436.0" y="181.4" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">cAMP ↑</text><rect x="597.8" y="150.0" width="156.4" height="52.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="676.0" y="171.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">protein kinase A</text><text x="676.0" y="190.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(active)</text><rect x="547.4" y="260.0" width="257.2" height="52.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="676.0" y="281.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">hormone-sensitive lipase</text><text x="676.0" y="300.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(phosphorylated = ON)</text><rect x="342.0" y="260.0" width="148.0" height="52.0" rx="26" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="416.0" y="281.9" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">stored</text><text x="416.0" y="300.9" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">triacylglycerol</text><rect x="130.4" y="250.5" width="131.2" height="71.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="196.0" y="272.4" text-anchor="middle" font-size="15" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">insulin ↓</text><text x="196.0" y="291.4" text-anchor="middle" font-size="15" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(would switch</text><text x="196.0" y="310.4" text-anchor="middle" font-size="15" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">HSL off)</text><rect x="241.0" y="370.0" width="190.0" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="336.0" y="391.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">fatty acids</text><text x="336.0" y="410.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(carried on albumin)</text><rect x="622.0" y="370.0" width="148.0" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="696.0" y="391.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glycerol</text><text x="696.0" y="410.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(water-soluble)</text><rect x="236.8" y="435.0" width="198.4" height="52.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="336.0" y="456.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">muscle, heart, liver:</text><text x="336.0" y="475.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">β-oxidation → ATP</text><rect x="588.4" y="435.0" width="215.2" height="52.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="696.0" y="456.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">liver: gluconeogenesis</text><text x="696.0" y="475.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">→ glucose for the brain</text><rect x="294.6" y="195.7" width="63.8" height="18.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="326.5" y="207.7" text-anchor="middle" font-size="14.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">receptor</text><rect x="499.8" y="154.0" width="70.5" height="18.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="535.0" y="166.0" text-anchor="middle" font-size="14.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">activates</text><rect x="682.0" y="214.5" width="104.1" height="33.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="734.0" y="225.7" text-anchor="middle" font-size="14.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">phosphorylates</text><text x="734.0" y="242.3" text-anchor="middle" font-size="14.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(ATP → ADP)</text><rect x="473.4" y="249.5" width="90.6" height="33.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="518.7" y="260.7" text-anchor="middle" font-size="14.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">lipolysis</text><text x="518.7" y="277.3" text-anchor="middle" font-size="14.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(hydrolysis)</text></svg>