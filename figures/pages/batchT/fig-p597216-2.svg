amily="Nunito,Inter,Helvetica,Arial,sans-serif">carbamoyl</text><text x="196.5" y="230.4" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">phosphate</text><rect x="330.4" y="104.0" width="131.2" height="33.0" rx="16.5" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="396.0" y="125.9" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">2 ATP → 2 ADP</text><rect x="457.0" y="199.0" width="106.0" height="33.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="510.0" y="220.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">citrulline</text><rect x="712.6" y="199.0" width="164.8" height="33.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="795.0" y="220.9" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">argininosuccinate</text><rect x="708.4" y="75.5" width="173.2" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="795.0" y="97.4" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">aspartate</text><text x="795.0" y="116.4" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(brings the 2nd N)</text><rect x="607.0" y="118.3" width="148.0" height="33.0" rx="16.5" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="681.0" y="140.2" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">ATP → AMP + PPᵢ</text><rect x="750.4" y="332.0" width="89.2" height="33.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="795.0" y="353.9" text-anchor="middle" font-size="15" font-weight="700" 