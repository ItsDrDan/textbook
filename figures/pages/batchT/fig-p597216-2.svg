<svg data-printfix="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1172 507" width="1172" height="507" role="img" aria-label="The urea cycle in a liver cell. In the mitochondrial matrix, ammonium ion and bicarbonate are joined by carbamoyl phosphate synthetase (a ligase, 2 ATP) to make carbamoyl phosphate, which ornithine transcarbamoylase (a transferase) adds to ornithine to make citrulline. In the cytosol, argininosuccinate synthetase (a ligase, ATP to AMP) joins citrulline and aspartate to give argininosuccinate; argininosuccinate lyase (a lyase) splits it into arginine and fumarate, which goes to the citric acid cycle; arginase (a hydrolase) adds water to arginine, releasing urea and regenerating ornithine."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><rect x="20" y="20" width="514.5" height="224.75000000000003" rx="16" fill="#f5f9f7" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="32" y="40" font-size="14.5" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">mitochondrial matrix</text><rect x="571" y="20" width="448" height="457.50000000000006" rx="16" fill="#f7f8fb" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="583" y="40" font-size="14.5" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">cytosol</text><path d="M196.5 131.5 L196.5 185.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M196.5 185.5 L191.7 175.6 L201.3 175.6 Z" fill="#2d3f4b"/><path d="M249.3 215.5 L453.0 215.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M453.0 215.5 L443.1 220.3 L443.1 210.7 Z" fill="#2d3f4b"/><path d="M510.0 328.0 L510.0 236.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M510.0 236.0 L514.8 245.9 L505.2 245.9 Z" 