tases</text><text x="453.5" y="290.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(remove P)</text><rect x="638.5" y="250.0" width="330.0" height="52.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="803.5" y="271.9" text-anchor="middle" font-size="15" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">phosphorylase OFF, synthase ON:</text><text x="803.5" y="290.9" text-anchor="middle" font-size="15" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glycogen is built, not broken down</text><rect x="505.6" y="84.0" width="70.5" height="18.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="540.9" y="96.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">ATP → ADP</text><rect x="513.0" y="174.5" width="70.5" height="18.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="548.2" y="186.5" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">ATP → ADP</text><rect x="685.4" y="89.0" width="90.6" height="18.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="730.7" y="101.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">breakdown ON</text><rect x="671.5" y="170.6" width="97.4" height="18.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="720.2" y="182.6" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">synthesis OFF</text><rect x="851.1" y="114.0" width="83.9" height="18.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="893.1" y="126.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glucose out</text><rect x="528.0" y="254.0" width="97.4" height="18.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="576.7" y="266.0" text-anchor="middle" font-size="13" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">reverses both</text></svg>