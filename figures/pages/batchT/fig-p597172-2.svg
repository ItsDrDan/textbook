<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1082 352" width="1082" height="352" role="img" aria-label="Hormonal control of glycogen metabolism by covalent modification. Glucagon or epinephrine binds a receptor on the cell surface and raises cyclic AMP, which activates protein kinase A. Protein kinase A uses ATP to phosphorylate glycogen phosphorylase, turning it on so glycogen is broken down to glucose, and to phosphorylate glycogen synthase, turning it off. Insulin activates phosphatases that remove the phosphates, so phosphorylase turns off and synthase turns on."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><path d="M164.7 136.0 L221.5 136.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M221.5 136.0 L211.6 140.8 L211.6 131.2 Z" fill="#2d3f4b"/><path d="M335.5 136.0 L371.3 136.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M371.3 136.0 L361.4 140.8 L361.4 131.2 Z" fill="#2d3f4b"/><path d="M535.7 107.8 L550.5 102.7" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M550.5 102.7 L542.7 110.5 L539.6 101.4 Z" fill="#2d3f4b"/><path d="M535.7 164.2 L571.5 176.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M571.5 176.5 L560.6 177.8 L563.7 168.7 Z" fill="#2d3f4b"/><path d="M706.5 102.7 L754.9 119.3" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M754.9 119.3 L744.0 120.6 L747.1 111.6 Z" fill="#2d3f4b"/><path d="M685.5 176.5 L754.9 152.7" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M754.9 152.7 L747.1 160.4 L744.0 151.4 Z" fill="#2d3f4b"/><path d="M852.1 136.0 L934.1 136.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M934.1 136.0 L924.2 140.8 L924.2 131.2 Z" fill="#2d3f4b"/><path d="M322.9 276.0 L388.1 276.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M388.1 276.0 L378.2 280.8 L378.2 271.2 Z" fill="#2d3f4b"/><path d="M518.9 276.0 L634.5 276.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M634.5 276.0 L624.6 280.8 L624.6 271.2 Z" fill="#2d3f4b"/><rect x="46.3" y="110.0" width="114.4" height="52.0" rx="10" fill="#f2e8f7" stroke="#b48cc8" stroke-width="2"/><text x="103.5" y="131.9" text-anchor="middle" font-size="15" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glucagon or</text><text x="103.5" y="150.9" text-anchor="middle" font-size="15" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">epinephrine</text><rect x="225.5" y="119.5" width="106.0" height="33.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="278.5" y="141.4" text-anchor="middle" font-size="15" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">cAMP rises</text><rect x="375.3" y="110.0" width="156.4" height="52.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="453.5" y="131.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">protein kinase A</text><text x="453.5" y="150.9" text-anchor="middle" font-size="15" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(active)</text><rect x="554.5" y="40.5" width="148.0" height="71.0" rx="35.5" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="628.5" y="62.4" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glycogen</text><text x="628.5" y="8