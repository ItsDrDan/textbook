<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 495" width="1052" height="495" role="img" aria-label="The three fates of pyruvate. With oxygen, in mitochondria, the pyruvate dehydrogenase complex oxidizes pyruvate to acetyl CoA, releasing carbon dioxide and reducing NAD+ to NADH; acetyl CoA enters the citric acid cycle. Without oxygen in muscle and in red blood cells, lactate dehydrogenase reduces pyruvate to lactate, converting NADH back to NAD+ so glycolysis can continue. In yeast, pyruvate decarboxylase removes carbon dioxide to give acetaldehyde, which alcohol dehydrogenase reduces to ethanol, again regenerating NAD+."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><path d="M441.0 73.0 L441.0 114.4" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M441.0 114.4 L436.2 104.5 L445.8 104.5 Z" fill="#2d3f4b"/><path d="M441.0 154.4 L441.0 186.8" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M441.0 186.8 L436.2 176.9 L445.8 176.9 Z" fill="#2d3f4b"/><path d="M372.1 154.4 L260.4 186.8" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M260.4 186.8 L268.6 179.5 L271.3 188.6 Z" fill="#2d3f4b"/><path d="M510.9 152.0 L686.3 196.2" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M686.3 196.2 L675.5 198.4 L677.8 189.2 Z" fill="#2d3f4b"/><path d="M441.0 244.8 L441.0 351.2" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M441.0 351.2 L436.2 341.3 L445.8 341.3 Z" fill="#2d3f4b"/><path d="M160.5 244.8 L160.5 351.2" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M160.5 351.2 L155.7 341.3 L165.3 341.3 Z"