ont-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Anaerobic: working muscle,</text><text x="160.5" y="229.8" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">red blood cells</text><rect x="690.3" y="190.8" width="147.4" height="50.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="764.0" y="211.8" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Anaerobic: yeast</text><text x="764.0" y="229.8" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(fermentation)</text><rect x="367.3" y="355.2" width="147.4" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="441.0" y="376.2" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Acetyl CoA (2 C)</text><rect x="98.5" y="355.2" width="123.9" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="160.5" y="376.2" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Lactate (3 C)</text><rect x="682.4" y="296.0" width="163.1" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="764.0" y="317.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Acetaldehyde (2 C)</text><rect x="702.0" y="388.5" width="123.9" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="764.0" y="409.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Ethanol (2 C)</text><rect x="536.6" y="246.3" width="131.8" height="50.0" rx="25" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="602.