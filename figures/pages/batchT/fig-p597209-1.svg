<svg data-printfix="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1032 412" width="1032" height="412" role="img" aria-label="The beta-oxidation cycle drawn as a square. A fatty acyl-CoA (top left) is oxidized by acyl-CoA dehydrogenase (an oxidoreductase, FAD to FADH2) to a trans-enoyl-CoA (top right); enoyl-CoA hydratase (a lyase) adds water to give 3-hydroxyacyl-CoA (bottom right); hydroxyacyl-CoA dehydrogenase (an oxidoreductase, NAD+ to NADH) gives 3-ketoacyl-CoA (bottom left); thiolase (a transferase) splits off acetyl-CoA with coenzyme A, leaving an acyl-CoA two carbons shorter that re-enters the cycle at the top."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><path d="M289.8 63.5 L625.4 63.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M625.4 63.5 L615.5 68.3 L615.5 58.7 Z" fill="#2d3f4b"/><path d="M716.0 93.5 L716.0 223.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M716.0 223.5 L711.2 213.6 L720.8 213.6 Z" fill="#2d3f4b"/><path d="M617.0 253.5 L319.2 253.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M319.2 253.5 L329.1 248.7 L329.1 258.3 Z" fill="#2d3f4b"/><path d="M216.0 223.5 L216.0 188.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M216.0 188.5 L220.8 198.4 L211.2 198.4 Z" fill="#2d3f4b"/><path d="M216.0 128.5 L216.0 93.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M216.0 93.5 L220.8 103.4 L211.2 103.4 Z" fill="#2d3f4b"/><path d="M294.9 283.5 L387.1 318.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M387.1 318.5 L376.1 319.4 L379.5 310.5 Z" fill="#8a97a6"/><rect x="146.2" y="37.5" width="139.6" height="52.0" rx="10" fill="#f2e8f7" stroke="#b48cc8" stroke-width="2"/><text x="216.0" y="59.4" text-anchor="middle" font-size="15" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">fatty acyl-CoA</text><text x="216.0" y="78.4" text-anchor="middle" font-size="15" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(n carbons)</text><rect x="629.4" y="37.5" width="173.2" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="716.0" y="59.4" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">trans-Δ²-enoyl-CoA</text><text x="716.0" y="78.4" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(new C=C at α,β)</text><rect x="621.0" y="227.5" width="190.0" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="716.0" y="249.4" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">L-3-hydroxyacyl-CoA</text><text x="716.0" y="268.4" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(OH on the β carbon)</text><rect x="116.8" y="227.5" width="198.4" height="52.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="216.0" y="249.4" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">3-ketoacyl-CoA</text><text x="216.0" y="268.4" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(C=O on the β carbon)</text><rect x="408.8" y="99.2" width="114.4" height="52.0" rx="26" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="466.0" y="121.1" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">FAD → FADH₂</text><text x="466.0" y="140.2" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(1.5 ATP)</text><rect x="387.8" y="165.8" width="156.4" height="52.0" rx="26" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="466.0" y="187.7" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">NAD<tspan dy="-0.5em" font-size="70%">+</tspan><tspan dy="0.35em"> → NADH + H</tspan><tspan dy="-0.5em" font-size="70%">+</tspan></text><text x="466.0" y="206.7" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(2.5 ATP)</text><rect x="129.4" y="132.5" width="173.2" height="52.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="216.0" y="154.4" text-anchor="middle" font-size="15" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">acyl-CoA shortened</text><text x="216.0" y="173.4" text-anchor="middle" font-size="15" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">by 2 C: repeat</text><rect x="375.2" y="322.5" width="181.6" height="52.0" rx="26" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="466.0" y="344.4" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">acetyl-CoA (2 C)</text><text x="466.0" y="363.4" text-anchor="middle" font-size="15" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">→ citric acid cycle</text><text x="866.0" y="163.9" text-anchor="middle" font-size="15" font-weight="600" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif"> </text><rect x="372.0" y="25.3" width="171.3" height="36.3" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="457.6" y="38.3" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">① acyl-CoA dehydrogenase</text><text x="457.6" y="54.7" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(oxidoreductase)</text><rect x="722.0" y="140.3" width="151.1" height="36.3" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="797.6" y="153.3" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">② enoyl-CoA hydratase</text><text x="797.6" y="169.7" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(lyase) + H₂O</text><rect x="345.5" y="257.3" width="245.2" height="36.3" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="468.1" y="270.3" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">③ L-3-hydroxyacyl-CoA dehydrogenase</text><text x="468.1" y="286.7" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(oxidoreductase)</text><rect x="38.7" y="187.8" width="171.3" height="36.3" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="124.4" y="200.8" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">④ thiolase (transferase)</text><text x="124.4" y="217.2" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">+ CoA-SH</text></svg>