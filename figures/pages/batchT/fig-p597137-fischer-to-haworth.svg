<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="1180" height="420" style="max-width:100%;height:auto" role="img" aria-label="Converting D-glucose from a Fischer projection to Haworth rings in three steps. Step 1, rotate: the Fischer projection is turned on its side with the aldehyde at the right, so groups that were on the left point up and groups on the right point down. Step 2, twist: the chain is curled into a ring shape with the CH2OH group pointing up, as it does for a D sugar, and the C5 OH reaching toward the C=O. Step 3, close: the C5 oxygen bonds to C1, giving two anomers: alpha with the new OH on C1 pointing down and beta with it pointing up. In both rings the OH groups on C2 and C4 point down and the OH on C3 points up."><rect width="100%" height="100%" fill="#ffffff"/><text x="105.0" y="99.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >CHO</text><line x1="105.0" y1="106.0" x2="105.0" y2="290.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="71.0" y1="141.0" x2="139.0" y2="141.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><text x="63.0" y="146.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="end" >H</text><text x="147.0" y="146.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="start" ><tspan fill="#c0392b">O</tspan>H</text><line x1="71.0" y1="183.0" x2="139.0" y2="183.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><text x="63.0" y="188.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="end" >HO</text><text x="147.0" y="188.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="start" >H</text><line x1="71.0" y1="225.0" x2="139.0" y2="225.