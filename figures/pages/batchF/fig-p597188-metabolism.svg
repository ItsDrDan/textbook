<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="920" height="370" style="max-width:100%;height:auto" role="img" aria-label="Overview of metabolism inside a cell. Nutrients (carbohydrates, fats and proteins) enter and are broken down by catabolism into small intermediates, releasing CO2; catabolism also reduces NAD plus to NADH, whose electrons go to O2 to make H2O, and it makes ATP from ADP. Anabolism uses the intermediates and the energy of ATP, together with minerals, nitrogen sources and vitamins, to build biomass: proteins, polysaccharides, fats and nucleic acids."><rect width="100%" height="100%" fill="#ffffff"/><rect x="170" y="44" width="720" height="270" rx="70" fill="#fdf1e7" stroke="#d9a06b" stroke-width="3"/><text x="190.0" y="72.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#b5651d" text-anchor="start" >Inside the cell</text><text x="70.0" y="222.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Nutrients</text><text x="70.0" y="240.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="middle" >(carbohydrates,</text><text x="70.0" y="255.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="middle" >fats, proteins)</text><line x1="120" y1="226" x2="205.0" y2="226.0" stroke="#2d3f4b" stroke-width="2.4"/><path d="M214 226 L205.0 230.9 L205.0 221.1 Z" fill="#2d3f4b"/><path d="M220 213 L394 213 L394 202 L420 226 L394 250 L394 239 L220 239 Z" fill="#c0392b"/><text x="310.0" y="231.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" >Catabolism</text><text x="470.0" y="222.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >small</text><text x="470.0" y="239.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >intermediates</text><path d="M520 213 L686 213 L686 202 L712 226 L686 250 L686 239 L520 239 Z" fill="#2f5fc4"/><text x="606.0" y="231.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" >Anabolism</text><text x="840.0" y="215.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Biomass:</text><text x="840.0" y="233.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#5a6478" text-anchor="middle" >proteins, polysac-</text><text x="840.0" y="248.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#5a6478" text-anchor="middle" >charides, fats,</text><text x="840.0" y="263.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#5a6478" text-anchor="middle" >nucleic acids</text><line x1="716" y1="226" x2="769.0" y2="226.0" stroke="#2d3f4b" stroke-width="2.4"/><path d="M778 226 L769.0 230.9 L769.0 221.1 Z" fill="#2d3f4b"/><line x1="320" y1="244" x2="320.0" y2="341.0" stroke="#c0392b" stroke-width="2.4"/><path d="M320 350 L315.1 341.0 L324.9 341.0 Z" fill="#c0392b"/><text x="332.0" y="352.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#c0392b" text-anchor="start" >CO<tspan font-size="11" dy="4">2</tspan><tspan dy="-4"> out</tspan></text><line x1="470" y1="352" x2="470.0" y2="261.0" stroke="#23704f" stroke-width="2.4"/><path d="M470 252 L474.9 261.0 L465.1 261.0 Z" fill="#23704f"/><text x="482.0" y="340.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#23704f" text-anchor="start" >minerals, nitrogen sources, vitamins in</text><text x="250.0" y="128.0" font-family=