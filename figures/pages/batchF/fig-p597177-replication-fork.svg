<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" style="max-width:100%;height:auto" role="img" aria-label="Diagram of a DNA replication fork. On the left the parent double helix is unwound at the fork by helicase, and the fork moves to the left. The two separated template strands run in opposite directions. On the lower template the leading strand is made continuously toward the fork by DNA polymerase, starting from one RNA primer. On the upper template the lagging strand is made in short Okazaki fragments, each started by primase with an RNA primer and extended by DNA polymerase away from the fork; ligase joins the fragments. New strands are built 5 prime to 3 prime."><rect width="100%" height="100%" fill="#ffffff"/><line x1="60" y1="150" x2="330" y2="150" stroke="#2d3f4b" stroke-width="5" stroke-linecap="round" /><line x1="60" y1="192" x2="330" y2="192" stroke="#2d3f4b" stroke-width="5" stroke-linecap="round" /><line x1="75" y1="155" x2="75" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="91" y1="155" x2="91" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="107" y1="155" x2="107" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="123" y1="155" x2="123" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="139" y1="155" x2="139" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="155" y1="155" x2="155" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="171" y1="155" x2="171" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="187" y1="155" x2="187" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="203" y1="155" x2="203" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="219" y1="155" x2="219" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="235" y1="155" x2="235" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="251" y1="155" x2="251" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="267" y1="155" x2="267" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="283" y1="155" x2="283" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="299" y1="155" x2="299" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><line x1="315" y1="155" x2="315" y2="187" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round" /><text x="40.0" y="156.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >3&#8242;</text><text x="40.0" y="198.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >5&#8242;</text><text x="195.0" y="228.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#5a6478" text-anchor="middle" >parent DNA</text><path d="M330 150 L410 108 L860 108" fill="none" stroke="#2d3f4b" stroke-width="5" stroke-linejoin="round"/><path d="M330 192 L410 234 L860 234" fill="none" stroke="#2d3f4b" stroke-width="5" stroke-linejoin="round"/><text x="884.0" y="114.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >5&#8242;</text><text x="884.0" y="240.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >3&#8242;</text><ellipse cx="338" cy="171" rx="26" ry="30" fill="#e9e3f5" stroke="#5b4790" stroke-width="2.5"/><text x="338.0" y="176.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="900" fill="#5b4790" text-anchor="middle" >H</text><text x="338.0" y="52.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#5b4790" text-anchor="middle" >helicase unwinds</text><text x="338.0" y="69.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#5b4790" text-anchor="middle" >the double helix</text><line x1="338" y1="76" x2="338" y2="136" stroke="#5b4790" stroke-width="1.6"/><line x1="300" y1="300" x2="200" y2="300" stroke="#5a6478" stroke-width="2.2"/><path d="M200 294 L188 300 L200 306 Z" fill="#5a6478"/><text x="310.0" y="305.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#5a6478" text-anchor="start" >fork moves this way</text><line x1="470" y1="254" x2="840" y2="254" stroke="#2f5fc4" stroke-width="5" stroke-linecap="round" /><line x1="840" y1="254" x2="860" y2="254" stroke="#c0392b" stroke-width="5" stroke-linecap="round" /><path d="M462 247 L451 254 L462 261 Z" fill="#2f5fc4"/><ellipse cx="452" cy="254" rx="22" ry="17" fill="#e3f1ea" stroke="#23704f" stroke-width="2.5"/><text x="452.0" y="259.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#23704f" text-anchor="middle" >P</text><text x="870.0" y="260.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f5fc4" text-anchor="start" >5&#8242;</text><text x="425.0" y="274.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f5fc4" text-anchor="middle" >3&#8242;</text><text x="650.0" y="290.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f5fc4" text-anchor="middle" >Leading strand: made continuously, toward the fork</text><line x1="452" y1="88" x2="470" y2="88" stroke="#c0392b" stroke-width="5" stroke-linecap="round" /><line x1="470" y1="88" x2="552" y2="88" stroke="#2f5fc4" stroke-width="5" stroke-linecap="round" /><text x="448.0" y="76.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f5fc4" text-anchor="middle" >5&#8242;</text><line x1="630" y1="88" x2="648" y2="88" stroke="#c0392b" stroke-width="5" stroke-linecap="round" /><line x1="648" y1="88" x2="722" y2="88" stroke="#2f5fc4" stroke-width="5" stroke-linecap="round" /><line x1="752" y1="88" x2="770" y2="88" stroke="#c0392b" stroke-width="5" stroke-linecap="round" /><line x1="770" y1="88" x2="856" y2="88" stroke="#2f5fc4" stroke-width="5" stroke-linecap="round" /><text x="858.0" y="76.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f5fc4" text-anchor="middle" >3&#8242;</text><path d="M556 81 L567 88 L556 95 Z" fill="#2f5fc4"/><ellipse cx="590" cy="88" rx="20" ry="16" fill="#e3f1ea" stroke="#23704f" stroke-width="2.5"/><text x="590.0" y="93.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#23704f" text-anchor="middle" >P</text><ellipse cx="428" cy="84" rx="19" ry="15" fill="#fdeedd" stroke="#b5651d" stroke-width="2.5"/><text x="428.0" y="89.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#b5651d" text-anchor="middle" >Pr</text><ellipse cx="737" cy="88" rx="16" ry="14" fill="#fff6cc" stroke="#9a7b00" stroke-width="2.5"/><text x="737.0" y="93.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#9a7b00" text-anchor="middle" >L</text><text x="650.0" y="30.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f5fc4" text-anchor="middle" >Lagging strand: made in short Okazaki fragments, away from the fork</text><rect x="26" y="258" width="0" height="0" fill="none"/><g font-family="Nunito,Inter,Helvetica,Arial,sans-serif"><text x="40.0" y="252.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#c0392b" text-anchor="start" >RNA primer</text><line x1="150" y1="248" x2="174" y2="248" stroke="#c0392b" stroke-width="5" stroke-linecap="round" /><text x="40.0" y="272.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f5fc4" text-anchor="start" >new DNA</text><line x1="150" y1="268" x2="174" y2="268" stroke="#2f5fc4" stroke-width="5" stroke-linecap="round" /><text x="40.0" y="292.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2d3f4b" text-anchor="start" >template DNA</text><line x1="150" y1="288" x2="174" y2="288" stroke="#2d3f4b" stroke-width="5" stroke-linecap="round" /></g><text x="40.0" y="330.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#5a6478" text-anchor="start" >Pr = primase (makes the RNA primer)  ·  P = DNA polymerase (adds nucleotides 5&#8242;&#8594;3&#8242;)  ·  L = ligase (joins fragments)</text></svg>