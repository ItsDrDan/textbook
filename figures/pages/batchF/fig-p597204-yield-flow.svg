ight="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="187.0" y="264.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">2 pyruvate (3 C)</text><rect x="294.4" y="126.0" width="108.2" height="32.0" rx="16" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="348.5" y="147.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">2 ATP (net)</text><rect x="302.2" y="162.0" width="92.6" height="50.0" rx="25" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="348.5" y="183.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">2 NADH</text><text x="348.5" y="201.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(cytosol)</text><rect x="518.9" y="72.0" width="210.2" height="68.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="624.0" y="93.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">shuttle:</text><text x="624.0" y="111.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">malate–aspartate → 5 ATP</text><text x="624.0" y="129.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glycerol-3-P → 3 ATP</text><rect x="523.4" y="243.0" width="163.1" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="605.0" y="264.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">2 acetyl-CoA (2 C)</text><rect x="539.1" y="315.0" width="131.8" height="50.0" rx="25" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="605.0" y="336.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">2 NADH → 5 ATP</text><text x="605.0" y="354.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">2 CO₂</text><rect x="774.4" y="234.0" width="155.3" height="50.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="852.0" y="255.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">citric acid cycle</text><text x="852.0" y="273.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(2 turns)</text><rect x="782.2" y="297.0" width="139.6" height="86.0" rx="43" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="852.0" y="318.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">6 NADH → 15 ATP</text><text x="852.0" y="336.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">2 FADH₂ → 3 ATP</text><text x="852.0" y="354.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">2 GTP → 2 ATP</text><text x="852.0" y="372.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">4 CO₂</text><rect x="820.7" y="72.0" width="233.7" height="68.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="937.5" y="93.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">electron transport +</text><text x="937.5" y="111.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">ATP synthase</text><text x="937.5" y="129.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">2.5 ATP / NADH, 1.5 / FADH₂</text><rect x="134.4" y="315.0" width="257.2" height="50.0" rx="25" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="263.0" y="336.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">total: 32 ATP</text><text x="263.0" y="354.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(30 with glycerol-3-P shuttle)</text><text x="1080.0" y="417.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif"> </text><rect x="109.4" y="163.0" width="71.6" height="30.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="145.2" y="174.0" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glycolysis</text><text x="145.2" y="187.0" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(10 steps)</text><rect x="347.0" y="225.0" width="90.1" height="30.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="392.1" y="236.0" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">pyruvate</text><text x="392.1" y="249.0" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">dehydrogenase</text></svg>