<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 12 1205 422" width="1205" height="422" role="img" aria-label="Bookkeeping flow for one glucose. Glycolysis in the cytosol gives 2 pyruvate, 2 ATP and 2 NADH. The two cytosolic NADH enter the mitochondrion through the malate–aspartate shuttle (worth 5 ATP) or the glycerol-3-phosphate shuttle (worth 3 ATP). Pyruvate dehydrogenase gives 2 acetyl-CoA and 2 NADH. Two turns of the citric acid cycle give 6 NADH, 2 FADH2 and 2 GTP. All NADH and FADH2 go to the electron transport chain, which makes 2.5 ATP per NADH and 1.5 ATP per FADH2. The total is 32 ATP with the malate–aspartate shuttle or 30 with the glycerol-3-phosphate shuttle."><rect x="0" y="0" width="1362" height="482" fill="#ffffff"/><rect x="20" y="20" width="505" height="405.99999999999994" rx="16" fill="#fff8e6" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="32" y="40" font-size="12" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Cytosol</text><rect x="362" y="20" width="847" height="405.99999999999994" rx="16" fill="#f3fbf6" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="374" y="40" font-size="12" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Mitochondrion</text><path d="M187.0 117.0 L187.0 239.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M187.0 239.0 L182.2 229.1 L191.8 229.1 Z" fill="#2d3f4b"/><path d="M187.0 117.0 L187.0 142.0 L290.4 142.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M290.4 142.0 L280.5 146.8 L280.5 137.2 Z" fill="#8a97a6"/><path d="M187.0 117.0 L187.0 187.0 L298.2 187.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M298.2 187.0 L288.3 191.8 L288.3 182.2 Z" fill="#8a97a6"/><path d="M398.8 172.2 L514.9 138.1" fill="none" stroke="#2d3f4b"