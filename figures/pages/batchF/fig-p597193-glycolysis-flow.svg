<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 470" width="1220" height="470" style="max-width:100%;height:auto" role="img" aria-label="Glycolysis in two phases. Energy-investment phase: glucose is phosphorylated by hexokinase using ATP to glucose 6-phosphate, isomerized to fructose 6-phosphate, phosphorylated again by phosphofructokinase-1 using a second ATP to fructose 1,6-bisphosphate, and split by aldolase into dihydroxyacetone phosphate (DHAP) and glyceraldehyde 3-phosphate; triose phosphate isomerase converts DHAP into a second glyceraldehyde 3-phosphate. Energy-payoff phase, run twice per glucose: glyceraldehyde 3-phosphate is oxidized by its dehydrogenase with NAD+ and inorganic phosphate to 1,3-bisphosphoglycerate; phosphoglycerate kinase transfers a phosphate to ADP giving ATP and 3-phosphoglycerate; a mutase moves the phosphate to give 2-phosphoglycerate; enolase removes water to give phosphoenolpyruvate; pyruvate kinase transfers the phosphate to ADP giving ATP and pyruvate. Net per glucose: 2 ATP, 2 NADH and 2 pyruvate, with no oxygen needed."><rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="30.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#5b4790" text-anchor="start" >Phase 1: energy investment (steps 1&#8211;5, once per glucose)</text><rect x="20" y="86.0" width="110" height="60" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="75.0" y="121.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Glucose</text><rect x="225" y="86.0" width="170" height="60" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="310.0" y="111.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Glucose</text><text x="310.0" y="130.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >6-phosphate</text><rect x="490" y="86.0" width="170" height="60" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="575.0" y="111.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Fructose</text><text x="575.0" y="130.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >6-phosphate</text><rect x="755" y="86.0" width="150" height="60" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="830.0" y="111.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Fructose 1,6-</text><text x="830.0" y="130.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >bisphosphate</text><rect x="1040" y="86.0" width="160" height="60" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="1120.0" y="111.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Glyceraldehyde</text><text x="1120.0" y="130.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >3-phosphate (&#215;2)</text><line x1="136" y1="116" x2="208.0" y2="116.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M219 116 L208.0 122.0 L208.0 110.0 Z" fill="#2d3f4b"/><text x="177.5" y="104.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">1 hexokinase</text><rect x="118.5" y="133" width="118.0" height="26" rx="13" fill="#fff3c4" stroke="#d4a72c" stroke-width="1.6"/><text x="177.5" y="151.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#7a5d00" text-anchor="middle" >ATP &#8594; ADP</text><line x1="401" y1="116" x2="473.0" y2="116.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M484 116 L473.0 122.0 L473.0 110.0 Z" fill="#2d3f4b"/><text x="442.5" y="92.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">2 phosphoglucose</text><text x="442.5" y="106.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">isomerase</text><line x1="666" y1="116" x2="738.0" y2="116.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M749 116 L738.0 122.0 L738.0 110.0 Z" fill="#2d3f4b"/><text x="707.5" y="92.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">3 phospho-</text><text x="707.5" y="106.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">fructokinase-1</text><rect x="648.5" y="133" width="118.0" height="26" rx="13" fill="#fff3c4" stroke="#d4a72c" stroke-width="1.6"/><text x="707.5" y="151.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#7a5d00" text-anchor="middle" >ATP &#8594; ADP</text><line x1="911" y1="116" x2="1023.0" y2="116.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M1034 116 L1023.0 122.0 L1023.0 110.0 Z" fill="#2d3f4b"/><text x="972.5" y="104.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">4 aldolase</text><rect x="915" y="23.0" width="100" height="34" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="965.0" y="45.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >DHAP</text><line x1="885" y1="84" x2="915.8" y2="64.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M925 58 L919.1 69.1 L912.5 58.9 Z" fill="#2d3f4b"/><line x1="1018" y1="44" x2="1061.3" y2="77.3" stroke="#2d3f4b" stroke-width="2.6"/><path d="M1070 84 L1057.6 82.1 L1065.0 72.5 Z" fill="#2d3f4b"/><line x1="1082" y1="80" x2="1038.7" y2="46.7" stroke="#2d3f4b" stroke-width="2.6"/><path d="M1030 40 L1042.4 41.9 L1035.0 51.5 Z" fill="#2d3f4b"/><text x="1040.0" y="22.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="start" font-style="italic">5 triose phosphate isomerase</text><text x="1100.0" y="222.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#23704f" text-anchor="end" >Phase 2: energy payoff (steps 6&#8211;10, twice per glucose)</text><line x1="1120" y1="148" x2="1120.0" y2="317.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M1120 328 L1114.0 317.0 L1126.0 317.0 Z" fill="#2d3f4b"/><text x="1110.0" y="250.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="end" font-style="italic">6 glyceraldehyde-3-phosphate</text><text x="1110.0" y="264.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="end" font-style="italic">dehydrogenase</text><rect x="912.0" y="281" width="196.0" height="26" rx="13" fill="#e3ecfb" stroke="#7d9bd6" stroke-width="1.6"/><text x="1010.0" y="299.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f5fc4" text-anchor="middle" >NAD<tspan baseline-shift="super" font-size="10">+</tspan> &#8594; NADH, + P<tspan baseline-shift="sub" font-size="10">i</tspan> (&#215;2)</text><rect x="1040" y="330.0" width="160" height="60" rx="10" fill="#f3f7f4" stroke="#8fa6b8" stroke-width="2"/><text x="1120.0" y="355.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >1,3-Bisphospho-</text><text x="1120.0" y="374.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >glycerate</text><rect x="820" y="330.0" width="160" height="60" rx="10" fill="#f3f7f4" stroke="#8fa6b8" stroke-width="2"/><text x="900.0" y="355.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >3-Phospho-</text><text x="900.0" y="374.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >glycerate</text><rect x="600" y="330.0" width="160" height="60" rx="10" fill="#f3f7f4" stroke="#8fa6b8" stroke-width="2"/><text x="680.0" y="355.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >2-Phospho-</text><text x="680.0" y="374.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >glycerate</text><rect x="380" y="330.0" width="160" height="60" rx="10" fill="#f3f7f4" stroke="#8fa6b8" stroke-width="2"/><text x="460.0" y="355.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Phosphoenol-</text><text x="460.0" y="374.5" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >pyruvate (PEP)</text><rect x="160" y="339.5" width="160" height="41" rx="10" fill="#f3f7f4" stroke="#8fa6b8" stroke-width="2"/><text x="240.0" y="365.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2d3f4b" text-anchor="middle" >Pyruvate (&#215;2)</text><line x1="1034" y1="360" x2="997.0" y2="360.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M986 360 L997.0 353.9 L997.0 366.1 Z" fill="#2d3f4b"/><text x="1010.0" y="320.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">7 phosphoglycerate</text><text x="1010.0" y="334.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">kinase</text><rect x="935.0" y="393" width="150.0" height="26" rx="13" fill="#fff3c4" stroke="#d4a72c" stroke-width="1.6"/><text x="1010.0" y="411.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#7a5d00" text-anchor="middle" >ADP &#8594; ATP (&#215;2)</text><line x1="814" y1="360" x2="777.0" y2="360.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M766 360 L777.0 353.9 L777.0 366.1 Z" fill="#2d3f4b"/><text x="790.0" y="320.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">8 phosphoglycerate</text><text x="790.0" y="334.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">mutase</text><line x1="594" y1="360" x2="557.0" y2="360.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M546 360 L557.0 353.9 L557.0 366.1 Z" fill="#2d3f4b"/><text x="570.0" y="320.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">9 enolase</text><text x="570.0" y="334.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" text-anchor="middle" font-style="italic">(&#8722; H<tspan font-size="10" baseline-shift="sub">2</tspan>O)</text><line x1="374" y1="360" x2="337.0" y2="360.0" stroke="#2d3f4b" stroke-width="2.6"/><path d="M326 360 L337.0 353.9 L337.0 366.1 Z" fill="#2d3f4b"/><text x="350.0" y="320.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#5a6478" t