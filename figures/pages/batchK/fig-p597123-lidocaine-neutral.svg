<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" style="max-width:100%;height:auto" role="img" aria-label="Qualitative horizontal bar chart of how much of the lidocaine is in the neutral, uncharged amine form, R3N, the only form that crosses the nerve membrane, in three places. No numbers are given. In the cartridge, which is acidic at about pH 3.5 to 6.5, the bar is very short: almost all the drug is the charged, dissolved salt R3NH+ Cl-. In healthy tissue, buffered to pH 7.4, the bar is much longer: more of the drug is neutral R3N, which crosses the nerve membrane. In an abscess or inflamed tissue, where the pH is lower than 7.4, the bar is short again: more drug stays as R3NH+, so anesthesia is slower and weaker."><rect width="100%" height="100%" fill="#ffffff"/><text x="30.0" y="34.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="900" fill="#2d3f4b" text-anchor="start" >How much of the lidocaine is in the neutral, membrane-crossing form (R<tspan font-size="11" baseline-shift="sub">3</tspan>N)?</text><text x="314.0" y="89.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="900" fill="#2d3f4b" text-anchor="end" >In the cartridge</text><text x="314.0" y="109.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#5a6478" text-anchor="end" >acidic, pH about 3.5&#8211;6.5</text><rect x="330" y="72" width="22" height="40" rx="6" fill="#8fa6b8"/><text x="364.0" y="97.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#5a6478" text-anchor="start" >almost all charged R<tspan font-size="11" baseline-shift="sub">3</tspan>NH<tspan font-size="11" baseline-shift="super">+</tspan>Cl<tspan font-size="11" baseline-shift="super">&#8722;</tspan>: the dissolved salt</text><text x="314.0" y="171.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="900" fill="#2d3f4b" text-anchor="end" >Healthy tissue</text><text x="314.0" y="191.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#5a6478" text-anchor="end" >buffered to pH 7.4</text><rect x="330" y="154" width="380" height="40" rx="6" fill="#23704f"/><text x="342.0" y="179.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="start" >more neutral R<tspan font-size="11" baseline-shift="sub">3</tspan>N: crosses the nerve membrane</text><text x="314.0" y="253.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="900" fill="#2d3f4b" text-anchor="end" >Abscess or inflamed tissue</text><text x="314.0" y="273.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#5a6478" text-anchor="end" >pH lower than 7.4</text><rect x="330" y="236" width="90" height="40" rx="6" fill="#c0392b"/><text x="432.0" y="261.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#c0392b" text-anchor="start" >more stays as R<tspan font-size="11" baseline-shift="sub">3</tspan>NH<tspan font-size="11" baseline-shift="super">+</tspan>: slower, weaker anesthesia</text><line x1="330.0" y1="60.0" x2="330.0" y2="286.0" stroke="#2d3f4b" stroke-width="2" stroke-linecap="round" /><line x1="330" y1="300" x2="919.0" y2="300.0" stroke="#2d3f4b" stroke-width="2"/><path d="M930 300 L919.0 306.1 L919.0 293.9 Z" fill="#2d3f4b"/><text x="330.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#5a6478" text-anchor="start" >less</text><text x="930.0" y="322.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#5a6478" text-anchor="end" >more</text><text x="630.0" y="344.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2d3f4b" text-anchor="middle" >share in the neutral form (qualitative, not to scale)</text></svg>