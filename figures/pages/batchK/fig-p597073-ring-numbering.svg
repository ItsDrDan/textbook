<svg data-printfix="1" xmlns="http://www.w3.org/2000/svg" class="mol" viewBox="-44 -81 250 203" width="212" height="173" role="img" aria-label="Skeletal structure of 1-bromo-2-ethylcyclopentane: a five-membered ring with a bromine on one carbon and an ethyl group on the neighboring carbon. Blue numbers label the ring carbons: 1 at the carbon bearing Br, 2 at the carbon bearing the ethyl group, then 3, 4 and 5 continuing around the ring. Text under the drawing: 1-bromo-2-ethylcyclopentane; bromo gets C1 because b comes before e."><line x1="120.2" y1="-36.8" x2="115.2" y2="-13.4" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="115.2" y1="-13.4" x2="82.4" y2="1.3" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="82.4" y1="1.3" x2="51.2" y2="-16.6" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="51.2" y1="-16.6" x2="20.0" y2="1.4" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="82.4" y1="1.3" x2="86.2" y2="37.1" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="86.2" y1="37.1" x2="121.4" y2="44.6" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="121.4" y1="44.6" x2="139.4" y2="13.4" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="139.4" y1="13.4" x2="115.2" y2="-13.4" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><text x="128.4" y="-42.1" text-anchor="middle" font-size="19" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round" aria-hidden="true">Br</text><text x="128.4" y="-42.1" text-anchor="middle" font-size="19" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" fill="#8e3b2f">Br</text><text x="130.7" y="-12.0" text-anchor="middle" font-size="15" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2f5fc4">1</text><text x="69.0" y="15.6" text-anchor="middle" font-size="15" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2f5fc4">2</text><text x="74.3" y="53.3" text-anchor="middle" font-size="15" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2f5fc4">3</text><text x="127.9" y="64.7" text-anchor="middle" font-size="15" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2f5fc4">4</text><text x="155.3" y="17.2" text-anchor="middle" font-size="15" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2f5fc4">5</text><text x="80.7" y="94.6" text-anchor="middle" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2d3f4b">1-bromo-2-ethylcyclopentane</text><text x="80.7" y="114.6" text-anchor="middle" font-size="14" font-weight="500" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2d3f4b">bromo gets C1 (b comes before e)</text></svg>
