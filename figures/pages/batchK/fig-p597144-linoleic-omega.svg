<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 416" width="1000" height="416" style="max-width:100%;height:auto" role="img" aria-label="Linoleic acid, an 18-carbon fatty acid with two cis double bonds, drawn twice as the same zigzag chain with the COOH group at the left and the CH3 end at the right. Each cis double bond bends the chain. Top drawing, chemist numbering: carbons are numbered 1 to 18 starting from the COOH carbon; the double bonds are between C9 and C10 and between C12 and C13, and C12, where the last double bond starts, is highlighted. Bottom drawing, omega numbering: the same carbons are numbered omega 1 to omega 18 starting from the CH3 carbon, so C18 is omega 1 and C13 is omega 6. Omega 6 is highlighted as the first double-bonded carbon reached from the CH3 end. A note reads 18 minus 12 equals 6: omega-6."><rect width="100%" height="100%" fill="#ffffff"/><circle cx="548.4" cy="28.0" r="13" fill="#f9dcd8"/><line x1="150.0" y1="120.0" x2="189.8" y2="97.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="189.8" y1="97.0" x2="229.7" y2="120.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="229.7" y1="120.0" x2="269.5" y2="97.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="269.5" y1="97.0" x2="309.3" y2="120.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="309.3" y1="120.0" x2="349.2" y2="97.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="349.2" y1="97.0" x2="389.0" y2="120.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="389.0" y1="120.0" x2="428.9" y2="97.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="428.9" y1="97.0" x2="468.7" y2="120.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="468.7" y1="120.0" x2="508.5" y2="97.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="472.0" y1="110.0" x2="498.3" y2="94.8" stroke="#2d3f4