<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" style="max-width:100%;height:auto" role="img" aria-label="Sketch of one glycogen molecule. A small protein, glycogenin, sits at the core on the left. A main chain of glucose units, drawn as circles, runs to the right from it; the first glucose, the reducing end, is tied to glycogenin. Straight runs are joined by alpha 1,4 links, and side chains branch off above and below the main chain, with smaller branches growing off the side chains. One branch point, where a new chain starts with an alpha 1,6 link, is circled. Every chain ends in a green non-reducing end with a free carbon 4 OH; there are many of them. A key explains that glycogen synthase adds glucose at the non-reducing ends and glycogen phosphorylase removes glucose there, so a highly branched molecule with many ends stores and releases glucose quickly."><rect width="100%" height="100%" fill="#ffffff"/><ellipse cx="96" cy="210" rx="36" ry="28" fill="#e9e3f5" stroke="#5b4790" stroke-width="2.5"/><line x1="132.0" y1="210.0" x2="150.0" y2="210.0" stroke="#5b4790" stroke-width="2.5" stroke-linecap="round" /><line x1="160.0" y1="210.0" x2="187.0" y2="210.0" stroke="#b8860b" stroke-width="2" stroke-linecap="round" /><line x1="187.0" y1="210.0" x2="214.0" y2="210.0" stroke="#b8860b" stroke-width="2" stroke-linecap="round" /><line x1="214.0" y1="210.0" x2="241.0" y2="210.0" stroke="#b8860b" stroke-width="2" stroke-linecap="round" /><line x1="241.0" y1="210.0" x2="268.0" y2="210.0" stroke="#b8860b" stroke-width="2" stroke-linecap="round" /><line x1="268.0" y1="210.0" x2="295.0" y2="210.0" stroke="#b8860b" stroke-width="2" stroke-linecap="round" /><line x1="295.0" y1="210.0" x2="322.0" y2="210.0" stroke="#b8860b" stroke-width="2" stroke-linecap="round" /><line x1="322.0" y1="210.0" x2="349.0" y2="210.0" stroke="#b8860b" stroke-width="2" stroke-linecap="round" /><line x1="349.0" y1="210.0" x2="376.0" y2="210.0" stroke="#b8860b" stro