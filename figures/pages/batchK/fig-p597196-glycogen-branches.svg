="138.0" y1="140" x2="153.2" y2="186.4" stroke="#5a6478" stroke-width="1.8"/><path d="M156.0 195 L148.5 188.0 L157.9 184.9 Z" fill="#5a6478"/><text x="130.0" y="100.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#5a6478" text-anchor="middle" >reducing end,</text><text x="130.0" y="117.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#5a6478" text-anchor="middle" >tied to glycogenin</text><circle cx="187.0" cy="210.0" r="15" fill="none" stroke="#5b4790" stroke-width="2.6"/><line x1="193.0" y1="294.0" x2="189.5" y2="237.0" stroke="#5b4790" stroke-width="1.8"/><path d="M189.0 228.0 L194.5 236.7 L184.6 237.3 Z" fill="#5b4790"/><text x="197.0" y="314.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#5b4790" text-anchor="middle" >&#945;(1&#8594;6) branch point</text><text x="556.0" y="215.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#9a7b00" text-anchor="start" >&#8592; &#945;(1&#8594;4) chain</text><circle cx="712" cy="150" r="10" fill="#f6dc8f" stroke="#b8860b" stroke-width="1.6"/><text x="732.0" y="155.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2d3f4b" text-anchor="start" >glucose unit</text><circle cx="712" cy="188" r="10" fill="#bfe3cf" stroke="#23704f" stroke-width="1.8"/><text x="732.0" y="193.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="900" fill="#23704f" text-anchor="start" >non-reducing end (free C4&#8211;OH)</text><text x="732.0" y="216.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#2d3f4b" text-anchor="start" >Glycogen synthase adds glucose here.</text><text x="732.0" y="236.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#2d3f4b" text-anchor="start" >Glycogen phosphorylase removes it here.</text><text x="732.0" y="266.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#5a6478" text-anchor="start" >Many branches = many ends, so</text><text x="732.0" y="286.0" font-family="Nunito,Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#5a6478" text-anchor="start" >glucose is stored and released fast.</text></svg>