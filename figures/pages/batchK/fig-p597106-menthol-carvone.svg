<svg data-printfix="1" xmlns="http://www.w3.org/2000/svg" class="mol" viewBox="-10 -109 389 260" width="330" height="221" role="img" aria-label="Skeletal structures of menthol and carvone with their chiral carbons marked by red asterisks. Left, menthol: a cyclohexane ring carrying an OH group, an isopropyl group on the neighboring ring carbon, and a methyl group on the ring carbon two positions away from the OH carbon on the other side; the three ring carbons that hold the OH, the isopropyl group and the methyl group are starred, so menthol has 3 chiral carbons. Right, carvone: a six-membered ring containing a ketone C=O and a C=C double bond, with a methyl group on the double-bond carbon next to the C=O and an isopropenyl group, C(CH3)=CH2, on the ring; only the ring carbon holding the isopropenyl group is starred, so carvone has 1 chiral carbon."><line x1="169.9" y1="0.1" x2="138.7" y2="-18.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="138.7" y1="-18.0" x2="138.8" y2="-54.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="138.7" y1="-18.0" x2="107.5" y2="-0.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="107.5" y1="-0.0" x2="76.4" y2="-18.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="76.4" y1="-18.0" x2="45.2" y2="-0.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="45.2" y1="-0.0" x2="45.2" y2="36.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="45.2" y1="36.0" x2="14.0" y2="53.9" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="45.2" y1="36.0" x2="76.3" y2="54.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="76.3" y1="54.0" x2="107.5" y2="36.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="107.5" y1="36.0" x2="128.3" y2="48.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round"/><line x1="107.5" y1="36.0" x2="107.5" y2="-0.0" stroke="#2d3f4b"