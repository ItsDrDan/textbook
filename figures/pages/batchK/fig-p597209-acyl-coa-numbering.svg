<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" style="max-width:100%;height:auto" role="img" aria-label="Two skeletal structures of a fatty acyl CoA chain, drawn as zigzag lines running left from the thioester end, which is at the right. Top, fatty acyl CoA: carbon 1 is the thioester carbon, C double-bonded to O and single-bonded to S of coenzyme A, written C(=O)-S-CoA. The carbons are numbered 1, 2, 3 and onward from that carbon. Carbon 2 is labeled alpha and carbon 3 is labeled beta; carbon 3 is highlighted as the CH2 that is oxidized to C=O in beta-oxidation. Bottom, the 3-ketoacyl CoA formed after reactions 1 to 3: the same chain with a C=O on carbon 3, the beta carbon, so 3-ketoacyl CoA and beta-ketoacyl CoA are the same compound. A dashed line between carbons 2 and 3 marks where thiolase cuts, between the alpha and beta carbons."><rect width="100%" height="100%" fill="#ffffff"/><circle cx="473.4" cy="120.0" r="15" fill="#f9dcd8" stroke="none"/><line x1="560.0" y1="120.0" x2="516.7" y2="145.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="516.7" y1="145.0" x2="473.4" y2="120.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="473.4" y1="120.0" x2="430.1" y2="145.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="430.1" y1="145.0" x2="386.8" y2="120.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="386.8" y1="120.0" x2="343.5" y2="145.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="343.5" y1="145.0" x2="300.2" y2="120.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="300.2" y1="120.0" x2="256.9" y2="145.0" stroke="#2d3f4b" stroke-width="2.6" stroke-linecap="round" /><line x1="563.2" y1="120.0" x2="563.2" y2="85.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" /><line x1="556.8" y1="120.0" x2="556.8" y2="85.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"