<svg data-printfix="1" xmlns="http://www.w3.org/2000/svg" class="mol" viewBox="-12 -48 595 152" width="595" height="152" role="img" aria-label="Markovnikov addition of HCl to propene. Propene, CH2=CH–CH3, in which the end CH2 carbon of the double bond has 2 H and the middle CH carbon has 1 H, plus hydrogen chloride, H–Cl, gives 2-chloropropane as the major product: the H (red) adds to the CH2 carbon, which already had more hydrogens, making it CH3, and the Cl (red) adds to the middle carbon, giving CH3–CHCl–CH3. A note says the minor product is 1-chloropropane, CH3CH2CH2Cl."><text x="0.0" y="0.0" text-anchor="start" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#2d3f4b"><tspan dy="0.0">CH</tspan><tspan dy="5.0" font-size="14">2</tspan></text><text x="36.9" y="0.0" text-anchor="start" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#2d3f4b"><tspan dy="0.0">=</tspan></text><text x="48.4" y="0.0" text-anchor="start" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#2d3f4b"><tspan dy="0.0">CH</tspan></text><text x="77.4" y="0.0" text-anchor="start" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#2d3f4b"><tspan dy="0.0">–</tspan></text><text x="88.4" y="0.0" text-anchor="start" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#2d3f4b"><tspan dy="0.0">CH</tspan><tspan dy="5.0" font-size="14">3</tspan></text><text x="7.2" y="-26.0" text-anchor="middle" font-size="13" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2f5fc4">2 H</text><text x="55.7" y="-26.0" text-anchor="middle" font-size="13" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2f5fc4">1 H</text><text x="62.7" y="70.0" text-anchor="middle" font-size="15" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2d3f4b">propene</text><text x="147.3" y="0.0" text-anchor="start" font-size="22" font-family="Arial,Helvetica,sans-serif" fill="#2d3f4b"><tspan dy="0.0">+</tspan></text><text x="183.3" y="0.0" text-anchor="start" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#c0392b"><tspan dy="0.0">H</tspan></text><text x="197.8" y="0.0" text-anchor="start" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#2d3f4b"><tspan dy="0.0">–</tspan></text><text x="208.8" y="0.0" text-anchor="start" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#c0392b"><tspan dy="0.0">Cl</tspan></text><text x="205.6" y="70.0" text-anchor="middle" font-size="15" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2d3f4b">hydrogen chloride</text><line x1="253.8" y1="-7.0" x2="333.8" y2="-7.0" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><line x1="333.8" y1="-7.0" x2="322.8" y2="-14.0" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><line x1="333.8" y1="-7.0" x2="322.8" y2="0.0" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="359.8" y="0.0" text-anchor="start" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#2d3f4b"><tspan dy="0.0">CH</tspan><tspan dy="5.0" font-size="14">2</tspan></text><text x="396.8" y="0.0" text-anchor="start" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#2d3f4b"><tspan dy="0.0">–</tspan></text><text x="407.8" y="0.0" text-anchor="start" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#2d3f4b"><tspan dy="0.0">CH</tspan></text><text x="436.8" y="0.0" text-anchor="start" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#2d3f4b"><tspan dy="0.0">–</tspan></text><text x="447.8" y="0.0" text-anchor="start" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#2d3f4b"><tspan dy="0.0">CH</tspan><tspan dy="5.0" font-size="14">3</tspan></text><line x1="367.1" y1="6.0" x2="367.1" y2="22.0" stroke="#2d3f4b" stroke-width="1.6" stroke-linecap="round"/><text x="367.1" y="42.0" text-anchor="middle" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#c0392b"><tspan dy="0.0">H</tspan></text><line x1="415.0" y1="6.0" x2="415.0" y2="22.0" stroke="#2d3f4b" stroke-width="1.6" stroke-linecap="round"/><text x="415.0" y="42.0" text-anchor="middle" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#c0392b"><tspan dy="0.0">Cl</tspan></text><text x="422.3" y="70.0" text-anchor="middle" font-size="15" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" fill="#2d3f4b">2-chloropropane (major)</text><text x="422.3" y="91.0" text-anchor="middle" font-size="14" font-family="Arial,Helvetica,sans-serif" fill="#6b7a85"><tspan dy="0.0">minor product: 1-chloropropane, CH</tspan><tspan dy="3.5" font-size="10">3</tspan><tspan dy="-3.5">CH</tspan><tspan dy="3.5" font-size="10">2</tspan><tspan dy="-3.5">CH</tspan><tspan dy="3.5" font-size="10">2</tspan><tspan dy="-3.5">Cl</tspan></text></svg>
