<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" style="max-width:100%;height:auto" role="img" aria-label="Two side-by-side comparisons of hydrogen bonding. Left: two acetic acid molecules, CH3COOH, face each other head to head. The O-H hydrogen of each acid is joined by a dotted hydrogen bond to the C=O oxygen of the other acid, closing a ring, so the pair is held by two hydrogen bonds. Right: two ethanol molecules, CH3CH2OH; the O-H hydrogen of one is joined by a single dotted hydrogen bond to the oxygen of the other, so the pair is held by one hydrogen bond. Lone pairs are not shown."><rect width="100%" height="100%" fill="#ffffff"/><line x1="118.0" y1="150.0" x2="180.0" y2="150.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" /><line x1="182.4" y1="152.2" x2="224.4" y2="106.2" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round" /><line x1="177.6" y1="147.8" x2="219.6" y2="101.8" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round" /><line x1="180.0" y1="150.0" x2="222.0" y2="196.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" /><line x1="222.0" y1="196.0" x2="268.0" y2="196.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" /><line x1="420.0" y1="150.0" x2="482.0" y2="150.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" /><line x1="417.6" y1="147.8" x2="375.6" y2="193.8" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round" /><line x1="422.4" y1="152.2" x2="380.4" y2="198.2" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round" /><line x1="420.0" y1="150.0" x2="378.0" y2="104.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" /><line x1="378.0" y1="104.0" x2="332.0" y2="104.0" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" /><line x1="280.0" y1="196.0" x2="365.0" y2="196.0" stroke="#23704f" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 7"/><line x1="320.0" y1="104.0" x2="235.0" y2="104.0" stroke="#23704f" stroke-w