<svg data-printfix="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 907 272" width="907" height="272" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Pyruvate (3 carbons) enters the mitochondrial matrix and is converted by the pyruvate dehydrogenase complex to acetyl-CoA (2 carbons). Carbon dioxide leaves, NAD+ is reduced to NADH, and coenzyme A is attached. The coenzymes are NAD+ (from niacin), coenzyme A (from pantothenic acid) and a coenzyme made from thiamine (vitamin B1)."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><path d="M177.3 136.0 L428.3 136.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M428.3 136.0 L418.4 140.8 L418.4 131.2 Z" fill="#2d3f4b"/><path d="M583.7 136.0 L692.9 136.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M692.9 136.0 L683.0 140.8 L683.0 131.2 Z" fill="#2d3f4b"/><path d="M177.3 136.0 L383.5 136.0 L383.5 196.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M383.5 196.0 L378.7 186.1 L388.3 186.1 Z" fill="#8a97a6"/><path d="M177.3 136.0 L208.5 136.0 L208.5 196.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M208.5 196.0 L203.7 186.1 L213.3 186.1 Z" fill="#8a97a6"/><path d="M545.4 196.0 L519.1 156.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M519.1 156.0 L528.6 161.7 L520.6 166.9 Z" fill="#8a97a6"/><rect x="33.7" y="111.0" width="139.6" height="50.0" rx="10" fill="#f2e8f7" stroke="#b48cc8" stroke-width="2"/><text x="103.5" y="132.0" text-anchor="middle" font-size="14" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">pyruvate (3 C)</text><text x="103.5" y="150.0" text-anchor="middle" font-size="14" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">from glycolysis</text><rect x="432.3" y="120.0" width="147.4" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="506.0" y="141.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">acetyl-CoA (2 C)</text><rect x="696.9" y="111.0" width="108.2" height="50.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="751.0" y="132.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">citric acid</text><text x="751.0" y="150.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">cycle</text><rect x="351.5" y="200.0" width="64.0" height="32.0" rx="16" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="383.5" y="221.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">CO₂</text><rect x="154.4" y="200.0" width="108.2" height="32.0" rx="16" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="208.5" y="221.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">NAD<tspan dy="-0.5em" font-size="70%">+</tspan><tspan dy="0.35em">&#160;→ NADH</tspan></text><rect x="512.2" y="200.0" width="92.6" height="32.0" rx="16" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="558.5" y="221.0" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">CoA–SH in</text><text x="296.0" y="76.0" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">pyruvate dehydrogenase complex</text><text x="296.0" y="94.0" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(NAD<tspan dy="-0.5em" font-size="70%">+</tspan><tspan dy="0.35em">, CoA, thiamine coenzyme)</tspan></text><rect x="251.6" y="142.0" width="102.4" height="30.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="302.8" y="153.0" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">oxidative</text><text x="302.8" y="166.0" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">decarboxylation</text></svg>