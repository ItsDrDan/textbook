<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 957 415" width="1914" height="830" role="img" aria-label="Hub diagram of how carbohydrate, lipid and protein metabolism overlap. Carbohydrates convert to and from pyruvate by glycolysis and gluconeogenesis; triacylglycerols give fatty acids and glycerol; proteins give amino acids. Pyruvate, fatty acids and ketogenic amino acids all feed acetyl-CoA, which enters the citric acid cycle or, in the liver, becomes ketone bodies, and which can be built back into fatty acids but not into glucose. Pyruvate and glucogenic amino acids feed oxaloacetate and alpha-ketoglutarate, citric acid cycle intermediates that can be turned into glucose. The cycle releases carbon dioxide and, through electron transport, ATP."><rect width="957" height="632" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><path d="M164.0 96.0 L164.0 195.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M164.0 195.5 L159.2 185.6 L168.8 185.6 Z" fill="#2d3f4b"/><path d="M164.0 96.0 L168.8 105.9 L159.2 105.9 Z" fill="#2d3f4b"/><path d="M478.5 96.0 L478.5 195.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M478.5 195.5 L473.7 185.6 L483.3 185.6 Z" fill="#2d3f4b"/><path d="M478.5 96.0 L483.3 105.9 L473.7 105.9 Z" fill="#2d3f4b"/><path d="M429.2 96.0 L364.2 135.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M364.2 135.5 L370.2 126.3 L375.2 134.4 Z" fill="#8a97a6"/><path d="M281.9 173.5 L212.6 198.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M212.6 198.5 L220.3 190.6 L223.5 199.6 Z" fill="#8a97a6"/><path d="M793.0 96.0 L793.0 195.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M793.0 195.5 L788.2 185.6 L797.8 185.6 Z" fill="#2d3f4b"/><