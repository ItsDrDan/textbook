<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="1800" height="640" style="max-width:100%;height:auto" role="img" aria-label="Loading a tRNA in two steps, both catalyzed by aminoacyl-tRNA synthetase. Step 1: an amino acid (carboxylate, alpha carbon with NH3+ and H, side chain R) reacts with ATP; pyrophosphate is released and AMP is attached to the carboxyl group, giving aminoacyl-AMP. Step 2: the amino acid is transferred to the 3' OH of its tRNA as an ester, giving aminoacyl-tRNA (a charged tRNA), and AMP is released. Each amino acid has its own synthetase that matches it to the right tRNA."><title>Loading a tRNA in two steps, both catalyzed by aminoacyl-tRNA synthetase. Step 1: an amino acid (carboxylate, alpha carbon with NH3+ and H, side chain R) reacts with ATP; pyrophosphate is released and AMP is attached to the carboxyl group, giving aminoacyl-AMP. Step 2: the amino acid is transferred to the 3' OH of its tRNA as an ester, giving aminoacyl-tRNA (a charged tRNA), and AMP is released. Each amino acid has its own synthetase that matches it to the right tRNA.</title><rect width="900" height="680" fill="#ffffff"/><text x="18" y="34.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="19" font-weight="900" fill="#5b4790">Loading (charging) a tRNA with its amino acid</text><g transform="translate(0 44)"><rect width="900" height="680" fill="#ffffff"/><text x="14" y="28.3" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="18" font-weight="900" fill="#5b4790">Step 1</text><g transform="translate(14 64)"><rect x="99" y="31" width="28.4" height="26" rx="9" fill="#fff0a8" stroke="#e8c547" stroke-width="1.4"/><text x="64.2" y="49.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">C</text><line x1="73.4" y1="33" x2="73.4" y2="14" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><line x1="66.6" y1="33" x2="66.6" y2="14" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="64.2" y="9.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#9c3346">O</text><line x1="79" y1="44" x2="100" y2="44" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="104" y="49.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">O<tspan font-size="11.5" dy="-6.4">−</tspan><tspan dy="6.4">&#8203;</tspan></text><line x1="70" y1="55" x2="70" y2="79" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="64.2" y="95.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">C</text><line x1="79" y1="90" x2="100" y2="90" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="104" y="95.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">H</text><line x1="61" y1="90" x2="40" y2="90" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="-0.6" y="95.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b"><tspan font-size="11.5" dy="-6.4">+</tspan><tspan dy="6.4">&#8203;</tspan>H<tspan font-size="11.5" dy="4.5">3</tspan><tspan dy="-4.5">&#8203;</tspan>N</text><line x1="70" y1="101" x2="70" y2="125" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="64.2" y="141.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">R</text></g><text x="64" y="240.9" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#3b4a63">Amino acid</text><line x1="197" y1="143" x2="410" y2="143" stroke="#2d3f4b" stroke-width="3.4" stroke-linecap="round"/><path d="M414 143L401.2 137.3L401.2 148.7z" fill="#2d3f4b"/><path d="M259.5 103 C 265.5 155, 345.5 155, 351.5 107" fill="none" stroke="#5a6478" stroke-width="2.4"/><path d="M351.5 103L343.6 109.1L350.8 113z" fill="#5a6478"/><text x="242.2" y="96.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#8a5a00">ATP</text><text x="342.4" y="96.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#8a4a0e">PP<tspan font-size="11.5" dy="4.5">i</tspan><tspan dy="-4.5">&#8203;</tspan></text><text x="213.6" y="171.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#5a6478" font-style="italic">aminoacyl-tRNA synthetase</text><g transform="translate(428 64)"><rect x="99" y="31" width="67.9" height="26" rx="9" fill="#fff0a8" stroke="#e8c547" stroke-width="1.4"/><text x="64.2" y="49.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">C</text><line x1="73.4" y1="33" x2="73.4" y2="14" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><line x1="66.6" y1="33" x2="66.6" y2="14" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="64.2" y="9.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#9c3346">O</text><line x1="79" y1="44" x2="100" y2="44" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="104" y="49.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">O–AMP</text><line x1="70" y1="55" x2="70" y2="79" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="64.2" y="95.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">C</text><line x1="79" y1="90" x2="100" y2="90" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="104" y="95.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">H</text><line x1="61" y1="90" x2="40" y2="90" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="-0.6" y="95.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b"><tspan font-size="11.5" dy="-6.4">+</tspan><tspan dy="6.4">&#8203;</tspan>H<tspan font-size="11.5" dy="4.5">3</tspan><tspan dy="-4.5">&#8203;</tspan>N</text><line x1="70" y1="101" x2="70" y2="125" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="64.2" y="141.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">R</text></g><text x="459.8" y="240.9" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#3b4a63">Aminoacyl–AMP</text></g><g transform="translate(0 336)"><rect width="900" height="680" fill="#ffffff"/><text x="14" y="28.3" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="18" font-weight="900" fill="#5b4790">Step 2</text><g transform="translate(14 64)"><rect x="99" y="31" width="67.9" height="26" rx="9" fill="#fff0a8" stroke="#e8c547" stroke-width="1.4"/><text x="64.2" y="49.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">C</text><line x1="73.4" y1="33" x2="73.4" y2="14" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><line x1="66.6" y1="33" x2="66.6" y2="14" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="64.2" y="9.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#9c3346">O</text><line x1="79" y1="44" x2="100" y2="44" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="104" y="49.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">O–AMP</text><line x1="70" y1="55" x2="70" y2="79" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="64.2" y="95.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">C</text><line x1="79" y1="90" x2="100" y2="90" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="104" y="95.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">H</text><line x1="61" y1="90" 