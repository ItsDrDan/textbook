<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 548" width="932" height="548" role="img" aria-label="The pentose phosphate pathway. Oxidative phase: glucose-6-phosphate is oxidized by glucose-6-phosphate dehydrogenase, reducing NADP+ to NADPH, to 6-phosphogluconate; a second dehydrogenase oxidizes and decarboxylates it to ribulose-5-phosphate, releasing carbon dioxide and a second NADPH. Non-oxidative phase: ribulose-5-phosphate is isomerized to ribose-5-phosphate for nucleotide synthesis, or rearranged by transketolase and transaldolase into fructose-6-phosphate and glyceraldehyde-3-phosphate, which re-enter glycolysis. NADPH is used for fatty acid and cholesterol synthesis and to keep glutathione reduced in red blood cells."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><rect x="20" y="41" width="640" height="233.5" rx="16" fill="#fbf6ee" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="32" y="61" font-size="12" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Oxidative phase (irreversible)</text><rect x="20" y="286" width="640" height="223" rx="16" fill="#f3f7f4" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="32" y="306" font-size="12" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Non-oxidative phase</text><path d="M217.6 139.5 L217.6 169.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M217.6 169.0 L212.8 159.1 L222.4 159.1 Z" fill="#2d3f4b"/><path d="M217.6 227.0 L217.6 305.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M217.6 305.5 L212.8 295.6 L222.4 295.6 Z" fill="#2d3f4b"/><path d="M217.6 363.5 L217.6 393.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M217.6 393.0 L212.8 383.1 L222.4 383.1 Z" fill="#2d3f4b"/><path d="M217.6 363.5 L222.4 373.4 L212.8 373.4 Z" fill="#2d3f4b"/><path d="M217.6 451.0 L217.6 470.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M217.6 470.0 L212.8 460.1 L222.4 460.1 Z" fill="#8a97a6"/><path d="M308.9 363.5 L401.7 393.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M401.7 393.0 L390.8 394.5 L393.7 385.5 Z" fill="#2d3f4b"/><path d="M308.9 363.5 L319.8 362.0 L316.9 371.0 Z" fill="#2d3f4b"/><path d="M493.0 451.0 L493.0 470.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M493.0 470.0 L488.2 460.1 L497.8 460.1 Z" fill="#8a97a6"/><path d="M517.9 152.5 L592.0 152.5 L624.0 159.3" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M624.0 159.3 L613.3 161.9 L615.3 152.6 Z" fill="#2d3f4b"/><path d="M517.9 243.5 L592.0 243.5 L624.0 234.2" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M624.0 234.2 L615.8 241.5 L613.1 232.4 Z" fill="#2d3f4b"/><path d="M772.0 238.0 L772.0 335.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M772.0 335.0 L767.2 325.1 L776.8 325.1 Z" fill="#2d3f4b"/><rect x="132.1" y="85.5" width="171.0" height="50.0" rx="10" fill="#f2e8f7" stroke="#b48cc8" stroke-width="2"/><text x="217.6" y="106.5" text-anchor="middle" font-size="14" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Glucose-6-phosphate</text><text x="217.6" y="124.5" text-anchor="middle" font-size="14" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(6 C)</text><rect x="136.0" y="173.0" width="163.1" height="50.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="217.6" y="194.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">6-Phosphogluconate</text><text x="217.6" y="212.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(6 C)</text><rect x="128.2" y="309.5" width="178.8" height="50.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="217.6" y="330.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Ribulose-5-phosphate</text><text x="217.6" y="348.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(5 C)</text><rect x="382.1" y="136.5" width="131.8" height="32.0" rx="16" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="448.0" y="157.5" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">NADP+ -&gt; NADPH</text><rect x="382.1" y="218.5" width="131.8" height="50.0" rx="25" fill="#fff6e2" stroke="#e2c77a" stroke-width="2"/><text x="448.0" y="239.5" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">NADP+ -&gt; NADPH</text><text x="448.0" y="257.5" text-anchor="middle" font-size="14" font-weight="800" fill="#80601a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">+ CO2 released</text><rect x="136.0" y="397.0" width="163.1" height="50.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="217.6" y="418.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Ribose-5-phosphate</text><text x="217.6" y="436.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(5 C)</text><rect x="112.5" y="474.0" width="210.2" height="50.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="217.6" y="495.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Nucleotides:</text><text x="217.6" y="513.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">ATP, NAD+, CoA, DNA, RNA</text><rect x="372.2" y="397.0" width="241.5" height="50.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="493.0" y="418.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Fructose-6-phosphate</text><text x="493.0" y="436.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">+ glyceraldehyde-3-phosphate</text><rect x="403.6" y="474.0" width="178.8" height="50.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="493.0" y="495.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Back into glycolysis</text><text x="493.0" y="513.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(Section 13.5)</text><rect x="628.0" y="148.0" width="288.0" height="86.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="772.0" y="169.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">NADPH is used for:</text><text x="772.0" y="187.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">- fatty acid and cholesterol synthesis</text><text x="772.0" y="205.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">- reducing glutathione (antioxidant</text><text x="772.0" y="223.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">  defense, red blood cells)</text><rect x="655.2" y="339.0" width="233.7" height="68.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="772.0" y="360.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">G6PD deficiency: too little</text><text x="772.0" y="378.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">NADPH -&gt; hemolysis under</text><text x="772.0" y="396.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">oxidative stress</text><rect x="223.6" y="139.3" width="133.2" height="30.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="290.2" y="150.3" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glucose-6-phosphate</text><text x="290.2" y="163.3" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">dehydrogenase (G6PD)</text><rect x="223.6" y="251.3" width="120.9" height="30.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="284.0" y="262.3" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">6-phosphogluconate</text><text x="284.0" y="275.3" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">dehydrogenase</text><rect x="223.6" y="369.8" width="65.4" height="17.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="256.3" y="380.8" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">isomerase</text><rect x="308.7" y="345.7" width="102.4" height="30.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="359.9" y="356.7" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">transketolase +</text><text x="359.9" y="369.7" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">transaldolase</text></svg>