<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1142 676" width="1142" height="676" role="img" aria-label="Glycogen metabolism map. Glycogenesis runs down the left: glucose is phosphorylated by hexokinase or glucokinase using ATP to glucose 6-phosphate, isomerized by phosphoglucomutase to glucose 1-phosphate, activated with UTP by UDP-glucose pyrophosphorylase to UDP-glucose releasing pyrophosphate, and added to glycogen by glycogen synthase, which forms alpha-1,4 links and releases UDP; branching enzyme then makes alpha-1,6 branches. Glycogenolysis runs up the right: glycogen phosphorylase uses inorganic phosphate to release glucose 1-phosphate from the non-reducing ends, debranching enzyme releases about ten percent of the glucose as free glucose, phosphoglucomutase converts glucose 1-phosphate to glucose 6-phosphate, and in liver glucose-6-phosphatase hydrolyzes it to free glucose for the blood, while in muscle glucose 6-phosphate enters glycolysis."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><rect x="20" y="20" width="362" height="534.8000000000001" rx="16" fill="#f1f8f3" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="32" y="40" font-size="12" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Glycogenesis (storing)</text><rect x="501" y="20" width="528.5" height="534.8000000000001" rx="16" fill="#fdf6f0" stroke="#c9d1dc" stroke-dasharray="6 4" stroke-width="1.5"/><text x="513" y="40" font-size="12" font-weight="800" fill="#4f5a74" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Glycogenolysis (releasing)</text><path d="M201.0 141.6 L201.0 180.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M201.0 180.0 L196.2 170.1 L205.8 170.1 Z" fill="#2d3f4b"/><path d="M201.0 220.0 L201.0 272.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejo