ont-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">debranching</text><text x="770.8" y="462.4" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">enzyme</text><text x="802.3" y="297.0" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">phosphoglucomutase</text><text x="515.5" y="154.6" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">glucose-6-</text><text x="515.5" y="172.6" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">phosphatase</text></svg>