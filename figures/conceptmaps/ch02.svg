<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1266 378" width="1266" height="378" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Concept map for Chapter 2, Alkanes and cycloalkanes. Alkanes (C–C single bonds) named by IUPAC rules (parent: longest chain; prefix: alkyl groups, halogens). Alkanes (C–C single bonds) form Isomers (chain: skeletal; location: positional). Alkanes (C–C single bonds) are Nonpolar (only: dispersion forces; so: insoluble in water). Alkanes (C–C single bonds) react by Combustion (gives: CO2 + H2O + energy). Alkanes (C–C single bonds) react by Halogenation (with light: substitution, X for H). Alkanes (C–C single bonds) ring form Cycloalkanes (formula: CnH2n)."><title>Concept map for Chapter 2, Alkanes and cycloalkanes. Alkanes (C–C single bonds) named by IUPAC rules (parent: longest chain; prefix: alkyl groups, halogens). Alkanes (C–C single bonds) form Isomers (chain: skeletal; location: positional). Alkanes (C–C single bonds) are Nonpolar (only: dispersion forces; so: insoluble in water). Alkanes (C–C single bonds) react by Combustion (gives: CO2 + H2O + energy). Alkanes (C–C single bonds) react by Halogenation (with light: substitution, X for H). Alkanes (C–C single bonds) ring form Cycloalkanes (formula: CnH2n).</title><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><text x="22" y="36" font-size="16" font-weight="800" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chapter 2 concept map: Alkanes and cycloalkanes</text><path d="M543.5 104.0 L178.6 173.4" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M178.6 173.4 L187.5 166.9 L189.2 176.3 Z" fill="#2d3f4b"/><path d="M120.5 204.5 L120.5 279.1" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.5 279.1 L115.7 269.2 L125.3 269.2 Z" fill="#8a97a6"/><p