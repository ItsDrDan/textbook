<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1061 378" width="1061" height="378" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Concept map for Chapter 5, Aldehydes and ketones. Carbonyl group C=O at chain end Aldehydes (-al) (oxidize to: carboxylic acids; detected by: Tollens', Benedict's). Carbonyl group C=O inside chain Ketones (-one) (do not: oxidize). Carbonyl group C=O reduce to Alcohols (aldehyde: 1° alcohol; ketone: 2° alcohol). Carbonyl group C=O + alcohol Hemiacetal (+ alcohol: acetal; in one molecule: sugar rings). Carbonyl group C=O handedness Chirality (4 different groups: chiral carbon; mirror images: enantiomers, D/L)."><title>Concept map for Chapter 5, Aldehydes and ketones. Carbonyl group C=O at chain end Aldehydes (-al) (oxidize to: carboxylic acids; detected by: Tollens', Benedict's). Carbonyl group C=O inside chain Ketones (-one) (do not: oxidize). Carbonyl group C=O reduce to Alcohols (aldehyde: 1° alcohol; ketone: 2° alcohol). Carbonyl group C=O + alcohol Hemiacetal (+ alcohol: acetal; in one molecule: sugar rings). Carbonyl group C=O handedness Chirality (4 different groups: chiral carbon; mirror images: enantiomers, D/L).</title><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><text x="22" y="36" font-size="16" font-weight="800" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chapter 5 concept map: Aldehydes and ketones</text><path d="M446.4 107.0 L194.3 166.9" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M194.3 166.9 L202.8 160.0 L205.0 169.3 Z" fill="#2d3f4b"/><path d="M120.5 204.5 L120.5 270.1" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.5 270.1 L115.7 260.2 L125.3 260.2 Z" fill="#8a97a6"/><path d="M488.4 107.0 L367.6 164.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-lineca