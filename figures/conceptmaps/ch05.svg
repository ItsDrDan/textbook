<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1061 466" width="1061" height="466" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Concept map for Chapter 5, Aldehydes and ketones. Carbonyl group C=O at chain end Aldehydes (-al) (oxidize to: carboxylic acids; detected by: Tollens', Benedict's). Carbonyl group C=O inside chain Ketones (-one) (do not: oxidize). Carbonyl group C=O reduce to Alcohols (aldehyde: 1° alcohol; ketone: 2° alcohol). Carbonyl group C=O + alcohol Hemiacetal (+ alcohol: acetal; in one molecule: sugar rings). Carbonyl group C=O handedness Chirality (4 different groups: chiral carbon; mirror images: enantiomers, D/L)."><title>Concept map for Chapter 5, Aldehydes and ketones. Carbonyl group C=O at chain end Aldehydes (-al) (oxidize to: carboxylic acids; detected by: Tollens', Benedict's). Carbonyl group C=O inside chain Ketones (-one) (do not: oxidize). Carbonyl group C=O reduce to Alcohols (aldehyde: 1° alcohol; ketone: 2° alcohol). Carbonyl group C=O + alcohol Hemiacetal (+ alcohol: acetal; in one molecule: sugar rings). Carbonyl group C=O handedness Chirality (4 different groups: chiral carbon; mirror images: enantiomers, D/L).</title><rect x="1" y="1" width="1059" height="464" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><text x="22" y="36" font-size="19" font-weight="800" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chapter 5 concept map: Aldehydes and ketones</text><path d="M460.0 119.5 L191.0 201.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M191.0 201.5 L199.1 194.0 L201.9 203.2 Z" fill="#2d3f4b"/><path d="M120.5 244.5 L120.5 314.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.5 314.5 L115.7 304.6 L125.3 304.6 Z" fill="#8a97a6"/><path d="M495.2 119.5 L360.8 201.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" st