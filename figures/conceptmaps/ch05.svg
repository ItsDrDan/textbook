nito,Inter,Helvetica,Arial,sans-serif">Aldehydes (-al)</text><rect x="15.4" y="274.1" width="210.2" height="86.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="120.5" y="295.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• oxidize to: carboxylic</text><text x="120.5" y="313.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   acids</text><text x="120.5" y="331.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• detected by: Tollens',</text><text x="120.5" y="349.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   Benedict's</text><rect x="259.6" y="168.5" width="131.8" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="325.5" y="189.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Ketones (-one)</text><rect x="247.9" y="285.5" width="155.3" height="32.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="325.5" y="306.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• do not: oxidize</text><rect x="488.1" y="168.5" width="84.7" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="530.5" y="189.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Alcohols</text><rect x="433.3" y="292.1" width="194.5" height="50.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="530.5" y="313.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• aldehyde: 1° alcohol</text><text x="530.5" y="331.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• ketone: 2° alcohol</text><rect x="685.3" y="168.5" width="100.4" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="735.5" y="189.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Hemiacetal</text><rect x="630.4" y="283.1" width="210.2" height="68.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="735.5" y="304.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• + alcohol: acetal</text><text x="735.5" y="322.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• in one molecule: sugar</text><text x="735.5" y="340.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   rings</text><rect x="894.2" y="168.5" width="92.6" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="940.5" y="189.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chirality</text><rect x="847.2" y="274.1" width="186.6" height="86.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="940.5" y="295.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• 4 different groups:</text><text x="940.5" y="313.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   chiral carbon</text><text x="940.5" y="331.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• mirror images:</text><text x="