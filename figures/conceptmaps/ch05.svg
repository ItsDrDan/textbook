nt-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">+ alcohol</text><rect x="765.2" y="159.0" width="88.4" height="20.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="809.4" y="173.0" text-anchor="middle" font-size="14" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">handedness</text></svg>