<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1266 466" width="1266" height="466" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Concept map for Chapter 10, Amino acids and proteins. Proteins built from Amino acids (R groups: nonpolar, polar, acidic, basic; in water: zwitterions, pI). Proteins joined by Peptide bonds (named: N- to C-terminus). Proteins 1° Sequence. Proteins 2° Helix and sheet (held by: backbone H bonds). Proteins 3° and 4° Folding (held by: R-group interactions). Proteins lose shape Denaturation (not: hydrolysis)."><title>Concept map for Chapter 10, Amino acids and proteins. Proteins built from Amino acids (R groups: nonpolar, polar, acidic, basic; in water: zwitterions, pI). Proteins joined by Peptide bonds (named: N- to C-terminus). Proteins 1° Sequence. Proteins 2° Helix and sheet (held by: backbone H bonds). Proteins 3° and 4° Folding (held by: R-group interactions). Proteins lose shape Denaturation (not: hydrolysis).</title><rect x="1" y="1" width="1264" height="464" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><text x="22" y="36" font-size="19" font-weight="800" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chapter 10 concept map: Amino acids and proteins</text><path d="M579.9 110.9 L187.9 206.6" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M187.9 206.6 L196.4 199.6 L198.6 208.9 Z" fill="#2d3f4b"/><path d="M120.5 244.5 L120.5 314.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.5 314.5 L115.7 304.6 L125.3 304.6 Z" fill="#8a97a6"/><path d="M580.1 119.5 L378.4 201.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M378.4 201.5 L385.8 193.3 L389.4 202.2 Z" fill="#2d3f4b"/><path d="M325.5 244.5 L325.5 346.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-line