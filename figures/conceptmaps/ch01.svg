electrons</text><text x="120.5" y="322.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• give each atom: its</text><text x="120.5" y="340.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   usual bonds + lone</text><text x="120.5" y="358.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   pairs</text><rect x="263.5" y="168.5" width="123.9" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="325.5" y="189.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Shape (VSEPR)</text><rect x="220.4" y="267.5" width="210.2" height="68.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="325.5" y="288.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• 2/3/4 groups: linear /</text><text x="325.5" y="306.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   trigonal planar /</text><text x="325.5" y="324.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   tetrahedral</text><rect x="488.1" y="168.5" width="84.7" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="530.5" y="189.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Polarity</text><rect x="425.4" y="283.1" width="210.2" height="68.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="530.5" y="304.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• from: polar bonds (to</text><text x="530.5" y="322.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   N, O, halogens)</text><text x="530.5" y="340.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• plus: asymmetric shape</text><rect x="703.5" y="168.5" width="64.0" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="735.5" y="189.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">IMFs</text><rect x="642.2" y="274.1" width="186.6" height="86.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="735.5" y="295.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• weakest: dispersion</text><text x="735.5" y="313.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• then: dipole–dipole</text><text x="735.5" y="331.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• strongest: hydrogen</text><text x="735.5" y="349.1" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   bonding</text><rect x="862.9" y="168.5" width="155.3" height="32.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="940.5" y="189.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Functional groups</text><rect x="843.3" y="276.5" width="194.5" height="50.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="940.5" y="297.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• decide: properties +</text><text x="940.5" y="315.5" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   reactions</text><rect x="280.3" y="118.5" width="59.3" height="17.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="309.9" y="129.5" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">drawn as</text><rect x="404.6" y="117.6" width="34.6" height="17.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="422.0" y="128.6" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">have</text><rect x="536.5" y="130.1" width="34.6" height="17.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="553.8" y="141.1" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">have</text><rect x="606.6" y="119.2" width="71.6" height="17.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="642.4" y="130.2" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">attract by</text><rect x="691.6" y="117.9" width="114.7" height="17.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="748.9" y="128.9" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">organic ones show</text></svg>