<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1061 466" width="1061" height="466" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Concept map for Chapter 1, Bonding review. Covalent molecules drawn as Lewis structures (count: valence electrons; give each atom: its usual bonds + lone pairs). Covalent molecules have Shape (VSEPR) (2/3/4 groups: linear / trigonal planar / tetrahedral). Covalent molecules have Polarity (from: polar bonds (to N, O, halogens); plus: asymmetric shape). Covalent molecules attract by IMFs (weakest: dispersion; then: dipole–dipole; strongest: hydrogen bonding). Covalent molecules organic ones show Functional groups (decide: properties + reactions)."><title>Concept map for Chapter 1, Bonding review. Covalent molecules drawn as Lewis structures (count: valence electrons; give each atom: its usual bonds + lone pairs). Covalent molecules have Shape (VSEPR) (2/3/4 groups: linear / trigonal planar / tetrahedral). Covalent molecules have Polarity (from: polar bonds (to N, O, halogens); plus: asymmetric shape). Covalent molecules attract by IMFs (weakest: dispersion; then: dipole–dipole; strongest: hydrogen bonding). Covalent molecules organic ones show Functional groups (decide: properties + reactions).</title><rect x="1" y="1" width="1059" height="464" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><text x="22" y="36" font-size="19" font-weight="800" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chapter 1 concept map: Bonding review</text><path d="M460.0 119.5 L191.0 201.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M191.0 201.5 L199.1 194.0 L201.9 203.2 Z" fill="#2d3f4b"/><path d="M120.5 244.5 L120.5 314.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.5 314.5 L115.7 304.6 L125.3 304.6 Z" fill="#8a97a6"/><path d="M495.2 119.5 L360.8 201.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M360.8 201.5 L366.7 192.3 L371.7 200.4 Z" fill="#2d3f4b"/><path d="M325.5 244.5 L325.5 325.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M325.5 325.0 L320.7 315.1 L330.3 315.1 Z" fill="#8a97a6"/><path d="M530.5 119.5 L530.5 201.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M530.5 201.5 L525.7 191.6 L535.3 191.6 Z" fill="#2d3f4b"/><path d="M530.5 244.5 L530.5 314.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M530.5 314.5 L525.7 304.6 L535.3 304.6 Z" fill="#8a97a6"/><path d="M565.8 119.5 L700.2 201.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M700.2 201.5 L689.3 200.4 L694.3 192.3 Z" fill="#2d3f4b"/><path d="M735.5 244.5 L735.5 304.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M735.5 304.0 L730.7 294.1 L740.3 294.1 Z" fill="#8a97a6"/><path d="M601.0 119.5 L870.0 201.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M870.0 201.5 L859.1 203.2 L861.9 194.0 Z" fill="#2d3f4b"/><path d="M940.5 244.5 L940.5 335.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M940.5 335.5 L935.7 325.6 L945.3 325.6 Z" fill="#8a97a6"/><rect x="433.8" y="80.5" width="193.4" height="35.0" rx="10" fill="#f2e8f7" stroke="#b48cc8" stroke-width="2"/><text x="530.5" y="104.1" text-anchor="middle" font-size="17" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Covalent molecules</text><rect x="33.3" y="205.5" width="174.3" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="120.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Lewis structures</text><rect x="23.8" y="318.5" width="193.4" height="119.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="120.5" y="342.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• count: valence</text><text x="120.5" y="363.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   electrons</text><text x="120.5" y="384.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• give each atom:</text><text x="120.5" y="405.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   its usual bonds</text><text x="120.5" y="426.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   + lone pairs</text><rect x="252.6" y="205.5" width="145.8" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="325.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Shape (VSEPR)</text><rect x="228.8" y="329.0" width="193.4" height="98.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="325.5" y="352.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• 2/3/4 groups:</text><text x="325.5" y="373.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   linear /</text><text x="325.5" y="394.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   trigonal planar</text><text x="325.5" y="415.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   / tetrahedral</text><rect x="481.4" y="205.5" width="98.2" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="530.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Polarity</text><rect x="433.8" y="318.5" width="193.4" height="119.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="530.5" y="342.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• from: polar</text><text x="530.5" y="363.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   bonds (to N, O,</text><text x="530.5" y="384.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   halogens)</text><text x="530.5" y="405.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• plus: asymmetric</text><text x="530.5" y="426.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   shape</text><rect x="703.5" y="205.5" width="64.0" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="735.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">IMFs</text><rect x="634.1" y="308.0" width="202.9" height="140.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="735.5" y="331.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• weakest:</text><text x="735.5" y="352.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   dispersion</text><text x="735.5" y="373.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• then:</text><text x="735.5" y="394.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   dipole–dipole</text><text x="735.5" y="415.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• strongest:</text><text x="735.5" y="436.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   hydrogen bonding</text><rect x="848.6" y="205.5" width="183.8" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="940.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Functional groups</text><rect x="858.1" y="339.5" width="164.8" height="77.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="940.5" y="363.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• decide:</text><text x="940.5" y="384.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   properties +</text><text x="940.5" y="405.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   reactions</text><rect x="221.2" y="154.7" width="79.4" height="21.5" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="260.9" y="170.2" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">drawn as</text><rect x="373.4" y="154.7" width="44.7" height="21.5" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="395.7" y="170.2" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">have</text><rect x="536.5" y="169.4" width="44.7" height="21.5" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="558.9" y="184.9" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">have</text><rect x="616.9" y="154.7" width="96.8" height="21.5" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="665.3" y="170.2" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">attract by</text><rect x="721.3" y="154.7" width="157.6" height="21.5" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="800.1" y="170.2" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">organic ones show</text></svg>