<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1061 378" width="1061" height="378" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Concept map for Chapter 1, Bonding review. Covalent molecules drawn as Lewis structures (count: valence electrons; give each atom: its usual bonds + lone pairs). Covalent molecules have Shape (VSEPR) (2/3/4 groups: linear / trigonal planar / tetrahedral). Covalent molecules have Polarity (from: polar bonds (to N, O, halogens); plus: asymmetric shape). Covalent molecules attract by IMFs (weakest: dispersion; then: dipole–dipole; strongest: hydrogen bonding). Covalent molecules organic ones show Functional groups (decide: properties + reactions)."><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><text x="22" y="36" font-size="16" font-weight="800" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chapter 1 concept map: Bonding review</text><path d="M446.4 107.0 L198.2 166.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M198.2 166.0 L206.8 159.1 L209.0 168.4 Z" fill="#2d3f4b"/><path d="M120.5 204.5 L120.5 261.1" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.5 261.1 L115.7 251.2 L125.3 251.2 Z" fill="#8a97a6"/><path d="M488.4 107.0 L367.6 164.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M367.6 164.5 L374.5 155.9 L378.6 164.6 Z" fill="#2d3f4b"/><path d="M325.5 204.5 L325.5 263.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M325.5 263.5 L320.7 253.6 L330.3 253.6 Z" fill="#8a97a6"/><path d="M530.5 107.0 L530.5 164.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M530.5 164.5 L525.7 154.6 L535.3 154.6 Z" fill="#2d3f4b"