ill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">fuel</text><rect x="57.1" y="205.5" width="126.7" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="120.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">β-Oxidation</text><rect x="19.1" y="318.5" width="202.9" height="119.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="120.5" y="342.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• per cycle: 1</text><text x="120.5" y="363.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   FADH2, 1 NADH, 1</text><text x="120.5" y="384.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   acetyl CoA</text><text x="120.5" y="405.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• palmitate: 106</text><text x="120.5" y="426.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   ATP</text><rect x="252.6" y="205.5" width="145.8" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="325.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Ketone bodies</text><rect x="243.1" y="350.0" width="164.8" height="56.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="325.5" y="373.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• too many:</text><text x="325.5" y="394.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,He