-anchor="middle" font-size="17" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">nonpolar solvents)</text><rect x="28.6" y="205.5" width="183.8" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="120.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Fatty acid esters</text><rect x="19.1" y="329.0" width="202.9" height="98.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="120.5" y="352.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• 3 FA + glycerol:</text><text x="120.5" y="373.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   triacylglycerols</text><text x="120.5" y="394.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• + phosphate:</text><text x="120.5" y="415.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   phospholipids</text><rect x="262.1" y="205.5" width="126.7" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="325.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Fatty acids</text><rect x="233.6" y="329.0" width="183.8" height="98.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="325.5" y="352.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• cis C=C: lower</text><text x="325.5" y="373.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   mp</text><text x="325.5" y="394.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• named: omega-3,</text><text x="325.5" y="415.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   omega-6</text><rect x="457.6" y="205.5" width="145.8" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="530.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">TAG reactions</text><rect x="438.6" y="318.5" width="183.8" height="119.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="530.5" y="342.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• H2:</text><text x="530.5" y="363.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   hydrogenation</text><text x="530.5" y="384.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• NaOH:</text><text x="530.5" y="405.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   saponification</text><text x="530.5" y="426.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   (soap)</text><rect x="686.4" y="205.5" width="98.2" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="735.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Steroids</text><rect x="643.6" y="329.0" width="183.8" height="98.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="735.5" y="352.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• examples:</text><text x="735.5" y="373.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   cholesterol,</text><text x="735.5" y="394.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   hormones, bile</text><text x="735.5" y="415.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   salts</text><rect x="886.7" y="205.5" width="107.7" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="940.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Membranes</text><rect x="858.1" y="318.5" width="164.8" height="119.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="940.5" y="342.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• bilayer:</text><text x="940.5" y="363.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   transport:</text><text x="940.5" y="384.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   diffusion,</text><text x="940.5" y="405.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   facilitated,</text><text x="940.5" y="426.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   active</text><rect x="200.0" y="158.9" width="104.1" height="20.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="252.0" y="172.9" text-anchor="middle" font-size="14" font-weight="700" font-style