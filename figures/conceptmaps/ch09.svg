<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1061 378" width="1061" height="378" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Concept map for Chapter 9, Lipids. Lipids (dissolve in nonpolar solvents) hydrolyzable Fatty acid esters (3 FA + glycerol: triacylglycerols; + phosphate: phospholipids). Lipids (dissolve in nonpolar solvents) building block Fatty acids (cis C=C: lower mp; named: omega-3, omega-6). Lipids (dissolve in nonpolar solvents) react TAG reactions (H2: hydrogenation; NaOH: saponification (soap)). Lipids (dissolve in nonpolar solvents) non-hydrolyzable Steroids (examples: cholesterol, hormones, bile salts). Lipids (dissolve in nonpolar solvents) form Membranes (bilayer: transport: diffusion, facilitated, active)."><title>Concept map for Chapter 9, Lipids. Lipids (dissolve in nonpolar solvents) hydrolyzable Fatty acid esters (3 FA + glycerol: triacylglycerols; + phosphate: phospholipids). Lipids (dissolve in nonpolar solvents) building block Fatty acids (cis C=C: lower mp; named: omega-3, omega-6). Lipids (dissolve in nonpolar solvents) react TAG reactions (H2: hydrogenation; NaOH: saponification (soap)). Lipids (dissolve in nonpolar solvents) non-hydrolyzable Steroids (examples: cholesterol, hormones, bile salts). Lipids (dissolve in nonpolar solvents) form Membranes (bilayer: transport: diffusion, facilitated, active).</title><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><text x="22" y="36" font-size="16" font-weight="800" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chapter 9 concept map: Lipids</text><path d="M441.0 108.3 L202.1 165.1" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M202.1 165.1 L210.7 158.1 L212.9 167.4 Z" fill="#2d3f4b"/><path d="M120.5 204.5 L120.5 270.1" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-lin