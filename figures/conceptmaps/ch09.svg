<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1061 466" width="1061" height="466" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Concept map for Chapter 9, Lipids. Lipids (dissolve in nonpolar solvents) hydrolyzable Fatty acid esters (3 FA + glycerol: triacylglycerols; + phosphate: phospholipids). Lipids (dissolve in nonpolar solvents) building block Fatty acids (cis C=C: lower mp; named: omega-3, omega-6). Lipids (dissolve in nonpolar solvents) react TAG reactions (H2: hydrogenation; NaOH: saponification (soap)). Lipids (dissolve in nonpolar solvents) non-hydrolyzable Steroids (examples: cholesterol, hormones, bile salts). Lipids (dissolve in nonpolar solvents) form Membranes (bilayer: transport: diffusion, facilitated, active)."><title>Concept map for Chapter 9, Lipids. Lipids (dissolve in nonpolar solvents) hydrolyzable Fatty acid esters (3 FA + glycerol: triacylglycerols; + phosphate: phospholipids). Lipids (dissolve in nonpolar solvents) building block Fatty acids (cis C=C: lower mp; named: omega-3, omega-6). Lipids (dissolve in nonpolar solvents) react TAG reactions (H2: hydrogenation; NaOH: saponification (soap)). Lipids (dissolve in nonpolar solvents) non-hydrolyzable Steroids (examples: cholesterol, hormones, bile salts). Lipids (dissolve in nonpolar solvents) form Membranes (bilayer: transport: diffusion, facilitated, active).</title><rect x="1" y="1" width="1059" height="464" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><text x="22" y="36" font-size="19" font-weight="800" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chapter 9 concept map: Lipids</text><path d="M425.5 130.0 L191.0 201.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M191.0 201.5 L199.1 194.0 L201.9 203.2 Z" fill="#2d3f4b"/><path d="M120.5 244.5 L120.5 325.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round"