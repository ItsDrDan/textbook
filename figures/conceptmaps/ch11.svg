<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1266 466" width="1266" height="466" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Concept map for Chapter 11, Enzymes and vitamins. Enzymes (protein catalysts) bind substrate at Active site (models: lock-and-key, induced fit). Enzymes (protein catalysts) sorted into Six classes (e.g.: oxidoreductase, hydrolase). Enzymes (protein catalysts) activity depends on Conditions (optimum: 37 °C, pH). Enzymes (protein catalysts) slowed by Inhibitors (types: competitive, noncompetitive, irreversible). Enzymes (protein catalysts) need Cofactors / coenzymes (from: B vitamins). Enzymes (protein catalysts) regulated by Control (fast: allosteric, feedback; slow: zymogens, genes)."><title>Concept map for Chapter 11, Enzymes and vitamins. Enzymes (protein catalysts) bind substrate at Active site (models: lock-and-key, induced fit). Enzymes (protein catalysts) sorted into Six classes (e.g.: oxidoreductase, hydrolase). Enzymes (protein catalysts) activity depends on Conditions (optimum: 37 °C, pH). Enzymes (protein catalysts) slowed by Inhibitors (types: competitive, noncompetitive, irreversible). Enzymes (protein catalysts) need Cofactors / coenzymes (from: B vitamins). Enzymes (protein catalysts) regulated by Control (fast: allosteric, feedback; slow: zymogens, genes).</title><rect x="1" y="1" width="1264" height="464" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><text x="22" y="36" font-size="19" font-weight="800" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chapter 11 concept map: Enzymes and vitamins</text><path d="M541.8 120.2 L187.9 206.6" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M187.9 206.6 L196.4 199.6 L198.6 208.9 Z" fill="#2d3f4b"/><path d="M120.5 244.5 L120.5 335.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/