th d="M1145.5 314.5 L1140.7 304.6 L1150.3 304.6 Z" fill="#8a97a6"/><rect x="545.8" y="70.0" width="174.3" height="56.0" rx="10" fill="#f2e8f7" stroke="#b48cc8" stroke-width="2"/><text x="633.0" y="93.6" text-anchor="middle" font-size="17" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Enzymes (protein</text><text x="633.0" y="114.6" text-anchor="middle" font-size="17" font-weight="800" fill="#5b3a72" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">catalysts)</text><rect x="57.1" y="205.5" width="126.7" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="120.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Active site</text><rect x="33.3" y="339.5" width="174.3" height="77.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="120.5" y="363.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• models:</text><text x="120.5" y="384.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   lock-and-key,</text><text x="120.5" y="405.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   induced fit</text><rect x="262.1" y="205.5" width="126.7" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="325.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Six classes</text><rect x="228.8" y="339.5" width="193.4" height="77.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="325.5" y="363.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• e.g.:</text><text x="325.5" y="384.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   oxidoreductase,</text><text x="325.5" y="405.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   hydrolase</text><rect x="471.9" y="205.5" width="117.2" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="530.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Conditions</text><rect x="438.6" y="350.0" width="183.8" height="56.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="530.5" y="373.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• optimum: 37 °C,</text><text x="530.5" y="394.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   pH</text><rect x="676.9" y="205.5" width="117.2" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="735.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Inhibitors</text><rect x="638.8" y="329.0" width="193.4" height="98.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="735.5" y="352.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• types:</text><text x="735.5" y="373.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   competitive,</text><text x="735.5" y="394.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   noncompetitive,</text><text x="735.5" y="415.6" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   irreversible</text><rect x="877.1" y="195.0" width="126.7" height="56.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="940.5" y="218.6" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Cofactors /</text><text x="940.5" y="239.6" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">coenzymes</text><rect x="843.8" y="360.5" width="193.4" height="35.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="940.5" y="384.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• from: B vitamins</text><rect x="1101.2" y="205.5" width="88.6" height="35.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="1145.5" y="229.1" text-anchor="middle" font-size="17" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Control</text><rect x="1053.6" y="318.5" width="183.8" height="119.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="1145.5" y="342.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• fast:</text><text x="1145.5" y="363.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   allosteric,</text><text x="1145.5" y="384.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   feedback</text><text x="1145.5" y="405.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">• slow: zymogens,</text><text x="1145.5" y="426.1" text-anchor="middle" font-size="17" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">   genes</text><rect x="201.1" y="158.6" width="157.6" height="21.5" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="279.9" y="174.1" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">bind substrate at</text><rect x="371.4" y="157.4" width="105.5" height="21.5" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="424.1" y="172.9" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">sorted into</text><rect x="569.4" y="172.2" width="174.9" height="21.5" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="656.8" y="187.7" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">activity depends on</text><rect x="708.6" y="172.2" width="88.1" height="21.5" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="752.7" y="187.7" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">slowed by</text><rect x="808.8" y="153.1" width="44.7" height="21.5" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="831.2" y="168.6" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">need</text><rect x="943.1" y="162.1" width="114.2" height="21.5" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="1000.2" y="177.6" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">regulated by</text></svg>