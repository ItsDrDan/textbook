<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 466" width="856" height="466" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Concept map for Chapter 14, Metabolism and energy. Acetyl CoA enters Citric acid cycle (per turn: 3 NADH, 1 FADH2, 1 GTP, 2 CO2). Acetyl CoA NADH, FADH2 go to Electron transport (ends at: O2 → H2O; pumps: H+ out of the matrix). Acetyl CoA H+ flows back through ATP synthase (process: oxidative phosphorylation). Acetyl CoA total ATP per glucose (liver: 32; muscle, brain: 30)."><title>Concept map for Chapter 14, Metabolism and energy. Acetyl CoA enters Citric acid cycle (per turn: 3 NADH, 1 FADH2, 1 GTP, 2 CO2). Acetyl CoA NADH, FADH2 go to Electron transport (ends at: O2 → H2O; pumps: H+ out of the matrix). Acetyl CoA H+ flows back through ATP synthase (process: oxidative phosphorylation). Acetyl CoA total ATP per glucose (liver: 32; muscle, brain: 30).</title><rect x="1" y="1" width="854" height="464" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><text x="22" y="36" font-size="19" font-weight="800" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chapter 14 concept map: Metabolism and energy</text><path d="M375.1 119.5 L173.4 201.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M173.4 201.5 L180.8 193.3 L184.4 202.2 Z" fill="#2d3f4b"/><path d="M120.5 244.5 L120.5 335.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.5 335.5 L115.7 325.6 L125.3 325.6 Z" fill="#8a97a6"/><path d="M410.4 119.5 L343.1 201.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M343.1 201.5 L345.7 190.8 L353.1 196.9 Z" fill="#2d3f4b"/><path d="M325.5 244.5 L325.5 325.0" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M325.5 325.0 L320.7 31