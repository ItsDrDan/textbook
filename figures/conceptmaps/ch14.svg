<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 378" width="856" height="378" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Concept map for Chapter 14, Metabolism and energy. Acetyl CoA enters Citric acid cycle (per turn: 3 NADH, 1 FADH2, 1 GTP, 2 CO2). Acetyl CoA NADH, FADH2 go to Electron transport (ends at: O2 → H2O; pumps: H+ out of the matrix). Acetyl CoA H+ flows back through ATP synthase (process: oxidative phosphorylation). Acetyl CoA total ATP per glucose (liver: 32; muscle, brain: 30)."><title>Concept map for Chapter 14, Metabolism and energy. Acetyl CoA enters Citric acid cycle (per turn: 3 NADH, 1 FADH2, 1 GTP, 2 CO2). Acetyl CoA NADH, FADH2 go to Electron transport (ends at: O2 → H2O; pumps: H+ out of the matrix). Acetyl CoA H+ flows back through ATP synthase (process: oxidative phosphorylation). Acetyl CoA total ATP per glucose (liver: 32; muscle, brain: 30).</title><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><text x="22" y="36" font-size="16" font-weight="800" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chapter 14 concept map: Metabolism and energy</text><path d="M373.8 104.2 L183.6 164.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M183.6 164.5 L191.6 157.0 L194.5 166.1 Z" fill="#2d3f4b"/><path d="M120.5 204.5 L120.5 272.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.5 272.5 L115.7 262.6 L125.3 262.6 Z" fill="#8a97a6"/><path d="M407.0 107.0 L346.5 164.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M346.5 164.5 L350.4 154.2 L357.0 161.1 Z" fill="#2d3f4b"/><path d="M325.5 204.5 L325.5 279.1" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M325.5 279.1 L320.7 269.2 L330.3