<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1061 378" width="1061" height="378" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Concept map for Chapter 8, Carbohydrates. Sugars one unit Monosaccharides (C=O type: aldose / ketose; drawn as: Fischer, D/L). Sugars cyclize to Hemiacetal rings (anomers: α / β (Haworth)). Sugars redox Sugar reactions (oxidized: reducing sugars, sugar acids; reduced: sugar alcohols). Sugars glycosidic bond Disaccharides (examples: maltose, lactose, sucrose). Sugars many units Polysaccharides (examples: starch, glycogen, cellulose)."><title>Concept map for Chapter 8, Carbohydrates. Sugars one unit Monosaccharides (C=O type: aldose / ketose; drawn as: Fischer, D/L). Sugars cyclize to Hemiacetal rings (anomers: α / β (Haworth)). Sugars redox Sugar reactions (oxidized: reducing sugars, sugar acids; reduced: sugar alcohols). Sugars glycosidic bond Disaccharides (examples: maltose, lactose, sucrose). Sugars many units Polysaccharides (examples: starch, glycogen, cellulose).</title><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><text x="22" y="36" font-size="16" font-weight="800" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chapter 8 concept map: Carbohydrates</text><path d="M492.0 96.2 L194.3 166.9" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M194.3 166.9 L202.8 160.0 L205.0 169.3 Z" fill="#2d3f4b"/><path d="M120.5 204.5 L120.5 279.1" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.5 279.1 L115.7 269.2 L125.3 269.2 Z" fill="#8a97a6"/><path d="M492.0 105.3 L367.6 164.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M367.6 164.5 L374.5 155.9 L378.6 164.6 Z" fill="#2d3f4b"/><path d="M325.5 204.5 L325.5 272.5" fill="none" stroke="#8a97