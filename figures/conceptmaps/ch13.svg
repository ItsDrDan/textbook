<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1266 378" width="1266" height="378" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Concept map for Chapter 13, Carbohydrate metabolism. Glucose digested from Starch, sugars. Glucose broken down by Glycolysis (gives: 2 pyruvate, 2 ATP, 2 NADH). Glucose pyruvate goes to Acetyl CoA or lactate (with O2: acetyl CoA; without O2: lactate). Glucose stored as Glycogen (made by: glycogenesis; broken by: glycogenolysis). Glucose made by Gluconeogenesis (from: lactate, amino acids, glycerol). Glucose controlled by Hormones (lower: insulin; raise: glucagon, epinephrine)."><title>Concept map for Chapter 13, Carbohydrate metabolism. Glucose digested from Starch, sugars. Glucose broken down by Glycolysis (gives: 2 pyruvate, 2 ATP, 2 NADH). Glucose pyruvate goes to Acetyl CoA or lactate (with O2: acetyl CoA; without O2: lactate). Glucose stored as Glycogen (made by: glycogenesis; broken by: glycogenolysis). Glucose made by Gluconeogenesis (from: lactate, amino acids, glycerol). Glucose controlled by Hormones (lower: insulin; raise: glucagon, epinephrine).</title><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><text x="22" y="36" font-size="16" font-weight="800" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chapter 13 concept map: Carbohydrate metabolism</text><path d="M590.6 95.1 L190.4 171.2" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M190.4 171.2 L199.2 164.7 L201.0 174.0 Z" fill="#2d3f4b"/><path d="M590.6 100.5 L379.7 167.3" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M379.7 167.3 L387.7 159.8 L390.6 168.9 Z" fill="#2d3f4b"/><path d="M325.5 204.5 L325.5 272.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M325.5 272.5 L320.