<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1266 466" width="1266" height="466" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Concept map for Chapter 13, Carbohydrate metabolism. Glucose digested from Starch, sugars. Glucose broken down by Glycolysis (gives: 2 pyruvate, 2 ATP, 2 NADH). Glucose pyruvate goes to Acetyl CoA or lactate (with O2: acetyl CoA; without O2: lactate). Glucose stored as Glycogen (made by: glycogenesis; broken by: glycogenolysis). Glucose made by Gluconeogenesis (from: lactate, amino acids, glycerol). Glucose controlled by Hormones (lower: insulin; raise: glucagon, epinephrine)."><title>Concept map for Chapter 13, Carbohydrate metabolism. Glucose digested from Starch, sugars. Glucose broken down by Glycolysis (gives: 2 pyruvate, 2 ATP, 2 NADH). Glucose pyruvate goes to Acetyl CoA or lactate (with O2: acetyl CoA; without O2: lactate). Glucose stored as Glycogen (made by: glycogenesis; broken by: glycogenolysis). Glucose made by Gluconeogenesis (from: lactate, amino acids, glycerol). Glucose controlled by Hormones (lower: insulin; raise: glucagon, epinephrine).</title><rect x="1" y="1" width="1264" height="464" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><text x="22" y="36" font-size="19" font-weight="800" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Chapter 13 concept map: Carbohydrate metabolism</text><path d="M584.7 109.8 L202.1 203.1" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M202.1 203.1 L210.6 196.1 L212.9 205.4 Z" fill="#2d3f4b"/><path d="M584.7 117.6 L378.4 201.5" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M378.4 201.5 L385.8 193.3 L389.4 202.2 Z" fill="#2d3f4b"/><path d="M325.5 244.5 L325.5 335.5" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M325.5