<svg data-printfix="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 340" width="930" height="340" style="max-width:100%;height:auto" role="img" aria-label="Three panels viewing the Fo rotor from above: a ring of eight c subunits around the central gamma stalk, with the a subunit (stator) on the right. Panel 1: an H+ ion from the intermembrane space binds a c subunit next to the a subunit. Panel 2: the ring turns one step, carrying the loaded subunit into the membrane. Panel 3: after nearly a full turn the subunit reaches the a subunit again and releases its H+ into the matrix. Each H+ that passes turns the ring and the gamma stalk one step."><title>Three panels viewing the Fo rotor from above: a ring of eight c subunits around the central gamma stalk, with the a subunit (stator) on the right. Panel 1: an H+ ion from the intermembrane space binds a c subunit next to the a subunit. Panel 2: the ring turns one step, carrying the loaded subunit into the membrane. Panel 3: after nearly a full turn the subunit reaches the a subunit again and releases its H+ into the matrix. Each H+ that passes turns the ring and the gamma stalk one step.</title><rect width="100%" height="100%" fill="#ffffff"/><text x="18" y="36.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="19" font-weight="900" fill="#5b4790">How H<tspan dy="-0.5em" font-size="70%">+</tspan><tspan dy="0.35em">&#160;flow turns the F</tspan><tspan font-size="13.7" dy="5.3">o</tspan><tspan dy="-5.3">&#8203;</tspan> rotor (view from above)</text><text x="3.5" y="70.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="900" fill="#3b4a63">1. H<tspan dy="-0.5em" font-size="70%">+</tspan><tspan dy="0.35em">&#160;enters from the intermembrane space</tspan></text><circle cx="155" cy="180" r="92" fill="#f4f1fb" stroke="#c9bfe6" stroke-width="1.4"/><rect x="231" y="150" width="34" height="60" rx="10" fill="#cfe8dc" stroke="#23704f" stroke-width="2"/><text x="243.4" y="185.6" font-fam