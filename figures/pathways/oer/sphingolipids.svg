<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" style="max-width:100%;height:auto" role="img" aria-label="General structure of sphingolipids. A sphingosine backbone: carbon 1 carries CH2-O-X, carbon 2 carries an amide N-H bonded to C=O and a fatty acid chain R, carbon 3 carries an OH, followed by a trans CH=CH double bond and a long (CH2)12-CH3 tail. A table lists the classes: sphingosine has a free NH2 and X = H; ceramide has a fatty acid R and X = H; sphingomyelin has a fatty acid and X = phosphocholine; a cerebroside has a fatty acid and one sugar as X; a ganglioside has a fatty acid and a chain of sugars as X."><title>General structure of sphingolipids. A sphingosine backbone: carbon 1 carries CH2-O-X, carbon 2 carries an amide N-H bonded to C=O and a fatty acid chain R, carbon 3 carries an OH, followed by a trans CH=CH double bond and a long (CH2)12-CH3 tail. A table lists the classes: sphingosine has a free NH2 and X = H; ceramide has a fatty acid R and X = H; sphingomyelin has a fatty acid and X = phosphocholine; a cerebroside has a fatty acid and one sugar as X; a ganglioside has a fatty acid and a chain of sugars as X.</title><rect width="100%" height="100%" fill="#ffffff"/><text x="18" y="36.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="19" font-weight="900" fill="#5b4790">Sphingolipids: one backbone, different head groups</text><text x="18" y="58.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5a6478">Every sphingolipid is built on sphingosine. Change the two highlighted parts (R and X) to get each class.</text><rect x="139" y="95" width="24.2" height="30" rx="9" fill="#fff0a8" stroke="#e8c547" stroke-width="1.4"/><text x="145" y="116" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#2d3f4b">X–O–CH<tspan font-size="12.2" dy="4.8">2</tspan><tspan dy="-4.8">&#8203;</tspan></text><line x1="196" y1="122" x2="196" y2="154" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><line x1="196" y1="178" x2="196" y2="210" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="189.9" y="172" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#2d3f4b">C</text><line x1="186" y1="166" x2="170" y2="166" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="154.5" y="171.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">H</text><line x1="206" y1="166" x2="224" y2="166" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="228" y="171.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">NH</text><line x1="256" y1="166" x2="272" y2="166" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="276" y="171.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">C</text><line x1="284" y1="155" x2="284" y2="138" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><line x1="278" y1="155" x2="278" y2="138" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="275.6" y="135.3" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#9c3346">O</text><rect x="292" y="150" width="236" height="32" rx="9" fill="#fff0a8" stroke="#e8c547" stroke-width="1.4"/><line x1="290" y1="166" x2="304" y2="166" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="308" y="171.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#9c3346">R  (fatty acid chain)</text><text x="189.9" y="228" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#2d3f4b">C</text><line x1="186" y1="222" x2="170" y2="222" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="154.5" y="227.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">H</text><line x1="206" y1="222" x2="224" y2="222" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="228" y="227.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">OH</text><line x1="196" y1="234" x2="196" y2="266" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="184.5" y="283.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">CH</text><line x1="193" y1="290" x2="193" y2="312" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><line x1="199" y1="290" x2="199" y2="312" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="184.5" y="329.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">CH</text><line x1="196" y1="336" x2="196" y2="354" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="168.4" y="373.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">(CH<tspan font-size="11.5" dy="4.5">2</tspan><tspan dy="-4.5">&#8203;</tspan>)<tspan font-size="11.5" dy="4.5">12</tspan><tspan dy="-4.5">&#8203;</tspan></text><line x1="196" y1="380" x2="196" y2="396" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="181.1" y="415.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">CH<tspan font-size="11.5" dy="4.5">3</tspan><tspan dy="-4.5">&#8203;</tspan></text><text x="230" y="305.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5a6478" font-style="italic">trans C=C</text><path d="M140 136 Q 110 226 140 418" fill="none" stroke="#c9bfe6" stroke-width="2"/><text x="23.1" y="290.9" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#5b4790" font-style="italic">sphingosine</text><text x="39" y="308.9" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#5b4790" font-style="italic">backbone</text><rect x="462" y="210" width="392" height="34" rx="6" fill="#efeaf9"/><text x="470" y="232.9" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#5b4790">Class</text><text x="598" y="232.9" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#5b4790">R (on N)</text><text x="730" y="232.9" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#5b4790">X (on O)</text><text x="470" y="266.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#3b4a63">Sphingosine</text><text x="598" y="266.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#9c3346">none (free –NH<tspan font-size="9.7" dy="3.8">2</tspan><tspan dy="-3.8">&#8203;</tspan>)</text><text x="730" y="266.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2c5f9c">H</text><rect x="462" y="278" width="392" height="34" fill="#f7f9fc"/><text x="470" y="300.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#3b4a63">Ceramide</text><text x="598" y="300.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#9c3346">fatty acid</text><text x="730" y="300.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2c5f9c">H</text><text x="470" y="334.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#3b4a63">Sphingomyelin</text><text x="598" y="334.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#9c3346">fatty acid</text><text x="730" y="334.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2c5f9c">phosphocholine</text><rect x="462" y="346" width="392" height="34" fill="#f7f9fc"/><text x="470" y="368.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#3b4a63">Cerebroside</text><text x="598" y="368.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#9c3346">fatty acid</text><text x="730" y="368.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2c5f9c">one sugar</text><text x="470" y="402.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#3b4a63">Ganglioside</text><text x="598" y="402.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#9c3346">fatty acid</text><text x="730" y="402.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2c5f9c">chain of sugars</text><text x="462" y="446.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5a6478">Sphingomyelin is a phospholipid; cerebrosides and</text><text x="462" y="464.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5a6478">gangliosides are glycolipids. All have two nonpolar tails</text><text x="462" y="482.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5a6478">and a polar head.</text></svg>