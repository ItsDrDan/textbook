<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" width="720" height="468" style="max-width:100%;height:auto" role="img" aria-label="Glucose interconverts between an open-chain aldehyde form, a six-carbon Fischer-style chain with CHO at carbon 1 and OH groups on carbons 2 to 6, and a six-membered cyclic hemiacetal. The OH on carbon 5 adds to the C=O of carbon 1, closing a ring that contains an oxygen; carbon 1 becomes a hemiacetal carbon bearing an OH, drawn here pointing down (alpha). In water over 99 percent of glucose is in the ring form."><rect width="100%" height="100%" fill="#ffffff"/><text x="18" y="36.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="19" font-weight="900" fill="#5b4790">Glucose: open-chain aldehyde ⇌ cyclic hemiacetal</text><g transform="translate(50 62)"><rect x="58" y="-9" width="24" height="26" rx="9" fill="#fff0a8" stroke="#e8c547" stroke-width="1.4"/><rect x="99" y="31" width="21.5" height="26" rx="9" fill="#fff0a8" stroke="#e8c547" stroke-width="1.4"/><rect x="99" y="215" width="33" height="26" rx="9" fill="#fff0a8" stroke="#e8c547" stroke-width="1.4"/><text x="64.2" y="49.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">C</text><line x1="73.4" y1="33" x2="73.4" y2="14" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><line x1="66.6" y1="33" x2="66.6" y2="14" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="64.2" y="9.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#9c3346">O</text><line x1="79" y1="44" x2="100" y2="44" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="104" y="49.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">H</text><line x1="70" y1="55" x2="70" y2="79" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="64.2" y="95.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">C</text><line x1="79" y1="90" x2="100" y2="90" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="104" y="95.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">OH</text><line x1="61" y1="90" x2="40" y2="90" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="24.5" y="95.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">H</text><line x1="70" y1="101" x2="70" y2="125" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="64.2" y="141.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">C</text><line x1="79" y1="136" x2="100" y2="136" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="104" y="141.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">H</text><line x1="61" y1="136" x2="40" y2="136" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="13" y="141.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">HO</text><line x1="70" y1="147" x2="70" y2="171" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="64.2" y="187.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">C</text><line x1="79" y1="182" x2="100" y2="182" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="104" y="187.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">OH</text><line x1="61" y1="182" x2="40" y2="182" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="24.5" y="187.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">H</text><line x1="70" y1="193" x2="70" y2="217" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="64.2" y="233.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">C</text><line x1="79" y1="228" x2="100" y2="228" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="104" y="233.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">OH</text><line x1="61" y1="228" x2="40" y2="228" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="24.5" y="233.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">H</text><line x1="70" y1="239" x2="70" y2="263" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="64.2" y="279.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2d3f4b">CH<tspan font-size="11.5" dy="4.5">2</tspan><tspan dy="-4.5">&#8203;</tspan>OH</text></g><text x="133" y="96.9" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#8a94a6">1</text><text x="133" y="142.9" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#8a94a6">2</text><text x="133" y="188.9" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#8a94a6">3</text><text x="133" y="234.9" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#8a94a6">4</text><text x="133" y="280.9" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#8a94a6">5</text><text x="133" y="326.9" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#8a94a6">6</text><line x1="285" y1="204" x2="403" y2="204" stroke="#2d3f4b" stroke-width="2.8" stroke-linecap="round"/><path d="M405 204L391 197L391 204z" fill="#2d3f4b"/><line x1="287" y1="216" x2="405" y2="216" stroke="#2d3f4b" stroke-width="2.8" stroke-linecap="round"/><path d="M285 216L299 223L299 216z" fill="#2d3f4b"/><text x="286.4" y="184.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#5a6478">the C-5 –OH adds</text><text x="294.2" y="248.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#5a6478">to the C-1 C=O</text><g transform="translate(440 131)"><rect x="129.6" y="94" width="31.6" height="24" rx="9" fill="#fff0a8" stroke="#e8c547" stroke-width="1.4"/><line x1="50" y1="46" x2="103" y2="46" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><line x1="119" y1="51" x2="140" y2="70" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><line x1="140" y1="70" x2="112" y2="94" stroke="#2d3f4b" stroke-width="5" stroke-linecap="round"/><line x1="112" y1="94" x2="50" y2="94" stroke="#2d3f4b" stroke-width="5" stroke-linecap="round"/><line x1="50" y1="94" x2="22" y2="70" stroke="#2d3f4b" stroke-width="5" stroke-linecap="round"/><line x1="22" y1="70" x2="50" y2="46" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="106.2" y="51.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#9c3346">O</text><line x1="50" y1="44" x2="50" y2="20" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="44.6" y="15.3" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2d3f4b">CH<tspan font-size="10.8" dy="4.2">2</tspan><tspan dy="-4.2">&#8203;</tspan>OH</text><line x1="140" y1="72" x2="140" y2="96" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="134.6" y="111.3" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2d3f4b">OH</text><line x1="112" y1="96" x2="112" y2="120" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="106.6" y="135.3" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2d3f4b">OH</text><line x1="50" y1="92" x2="50" y2="68" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="44.6" y="63.3" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2d3f4b">OH</text><line x1="22" y1="72" x2="22" y2="96" stroke="#2d3f4b" stroke-width="2.2" stroke-linecap="round"/><text x="16.6" y="111.3" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2d3f4b">OH</text></g><text x="423.3" y="127.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#8a4a0e">C-1 is now a hemiacetal carbon</text><text x="9" y="389.1" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="900" fill="#3b4a63">Open-chain D-glucose (aldehyde)</text><text x="407.6" y="296.1" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="900" fill="#3b4a63">α-D-Glucose (six-membered ring)</text><text x="18" y="424.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#5a6478">In water, over 99% of glucose is in the ring form. The new –OH on C-1 can point down (α, shown)</text><text x="18" y="442.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#5a6478">or up (β). Highlighted: the aldehyde group and the C-5 –OH that react to close the ring.</text></svg>