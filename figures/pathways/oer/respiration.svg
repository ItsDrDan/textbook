<svg data-printfix="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" style="max-width:100%;height:auto" role="img" aria-label="Overview of glucose catabolism. In the cytosol, glycolysis converts glucose (6 carbons) into 2 pyruvate (3 carbons each), with a net 2 ATP and 2 NADH. Without oxygen, pyruvate becomes 2 lactate in muscle or 2 ethanol and 2 CO2 in yeast, recycling NADH to NAD+, so only the 2 ATP from glycolysis are made. With oxygen, pyruvate enters the mitochondrion: 2 pyruvate become 2 acetyl CoA, 2 CO2 and 2 NADH; two turns of the citric acid cycle give 4 CO2, 6 NADH, 2 FADH2 and 2 GTP; electron transport passes electrons from NADH and FADH2 to O2, forming water, and ATP synthase makes most of the ATP, for up to about 32 ATP per glucose. All 6 carbons leave as 6 CO2."><title>Overview of glucose catabolism. In the cytosol, glycolysis converts glucose (6 carbons) into 2 pyruvate (3 carbons each), with a net 2 ATP and 2 NADH. Without oxygen, pyruvate becomes 2 lactate in muscle or 2 ethanol and 2 CO2 in yeast, recycling NADH to NAD+, so only the 2 ATP from glycolysis are made. With oxygen, pyruvate enters the mitochondrion: 2 pyruvate become 2 acetyl CoA, 2 CO2 and 2 NADH; two turns of the citric acid cycle give 4 CO2, 6 NADH, 2 FADH2 and 2 GTP; electron transport passes electrons from NADH and FADH2 to O2, forming water, and ATP synthase makes most of the ATP, for up to about 32 ATP per glucose. All 6 carbons leave as 6 CO2.</title><rect width="100%" height="100%" fill="#ffffff"/><text x="18" y="36.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="19" font-weight="900" fill="#5b4790">What happens to glucose: with and without oxygen</text><rect x="10" y="50" width="880" height="640" rx="16" fill="#fffaf0" stroke="#ead9b8"/><text x="26" y="76.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="900" fill="#8a6a2a">Cytosol</text><rect x="330" y="84" width="240" height="54" rx="12" fill="#ffffff" stroke="#c9b27f" stroke-width="1.8"/><text x="397.5" y="113.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="900" fill="#2d3f4b">Glucose (6 C)</text><line x1="450" y1="138" x2="450" y2="182" stroke="#2d3f4b" stroke-width="3" stroke-linecap="round"/><path d="M450 182L454.9 171L445.1 171z" fill="#2d3f4b"/><rect x="250" y="186" width="400" height="76" rx="12" fill="#fff3d6" stroke="#d9b45a" stroke-width="1.8"/><text x="409.7" y="215.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="900" fill="#2d3f4b">Glycolysis</text><text x="378.2" y="235.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#3b4a63">net 2 ATP  +  2 NADH</text><line x1="450" y1="262" x2="450" y2="300" stroke="#2d3f4b" stroke-width="3" stroke-linecap="round"/><path d="M450 300L454.9 289L445.1 289z" fill="#2d3f4b"/><rect x="330" y="302" width="240" height="54" rx="12" fill="#ffffff" stroke="#c9b27f" stroke-width="1.8"/><text x="362.5" y="331.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="900" fill="#2d3f4b">2 Pyruvate (3 C each)</text><line x1="340" y1="340" x2="200" y2="400" stroke="#9c3346" stroke-width="3" stroke-linecap="round"/><path d="M200 400L212 400.2L208.1 391.2z" fill="#9c3346"/><text x="240.5" y="354.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#9c3346">no O<tspan font-size="9.7" dy="3.8">2</tspan><tspan dy="-3.8">&#8203;</tspan></text><rect x="30" y="404" width="250" height="108" rx="12" fill="#fdecef" stroke="#d9a1ad" stroke-width="1.8"/><text x="92.4" y="433.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="900" fill="#2d3f4b">Without oxygen</text><text x="95.6" y="453.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#3b4a63">muscle: 2 lactate</text><text x="72.9" y="474.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#3b4a63">yeast: 2 ethanol + 2 CO<tspan font-size="9.7" dy="3.8">2</tspan><tspan dy="-3.8">&#8203;</tspan></text><text x="75.4" y="495.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#3b4a63">NADH → NAD<tspan dy="-0.5em" font-size="70%">+</tspan><tspan dy="0.35em">&#160;(recycled)</tspan></text><text x="50.2" y="536.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#9c3346">only the 2 ATP from glycolysis</text><rect x="360" y="390" width="520" height="290" rx="60" fill="#eef5fb" stroke="#9fb7d4" stroke-width="2"/><text x="392" y="420.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="900" fill="#2c5f9c">Mitochondrion</text><line x1="560" y1="340" x2="640" y2="418" stroke="#23704f" stroke-width="3" stroke-linecap="round"/><path d="M640 418L635.6 406.8L628.7 413.9z" fill="#23704f"/><text x="612" y="366.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#23704f">O<tspan font-size="9.7" dy="3.8">2</tspan><tspan dy="-3.8">&#8203;</tspan> present</text><rect x="430" y="424" width="420" height="54" rx="12" fill="#ffffff" stroke="#9fb7d4" stroke-width="1.8"/><text x="469.1" y="453.4" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="900" fill="#2d3f4b">2 Pyruvate → 2 Acetyl CoA + 2 CO<tspan font-size="11.2" dy="4.3">2</tspan><tspan dy="-4.3">&#8203;</tspan> + 2 NADH</text><line x1="640" y1="478" x2="640" y2="500" stroke="#2d3f4b" stroke-width="3" stroke-linecap="round"/><path d="M640 500L644.9 489L635.1 489z" fill="#2d3f4b"/><rect x="430" y="502" width="420" height="74" rx="12" fill="#f4f1fb" stroke="#c9bfe6" stroke-width="1.8"/><text x="535.4" y="531.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="900" fill="#2d3f4b">Citric acid cycle (2 turns)</text><text x="523.1" y="551.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#3b4a63">4 CO<tspan font-size="9.7" dy="3.8">2</tspan><tspan dy="-3.8">&#8203;</tspan> + 6 NADH + 2 FADH<tspan font-size="9.7" dy="3.8">2</tspan><tspan dy="-3.8">&#8203;</tspan> + 2 GTP</text><line x1="640" y1="576" x2="640" y2="598" stroke="#2d3f4b" stroke-width="3" stroke-linecap="round"/><path d="M640 598L644.9 587L635.1 587z" fill="#2d3f4b"/><rect x="430" y="600" width="420" height="70" rx="12" fill="#e8f4ee" stroke="#9fcfb5" stroke-width="1.8"/><text x="493.6" y="629.6" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="16" font-weight="900" fill="#2d3f4b">Electron transport + ATP synthase</text><text x="474.1" y="649.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#3b4a63">NADH, FADH<tspan font-size="9.7" dy="3.8">2</tspan><tspan dy="-3.8">&#8203;</tspan> → O<tspan font-size="9.7" dy="3.8">2</tspan><tspan dy="-3.8">&#8203;</tspan> → H<tspan font-size="9.7" dy="3.8">2</tspan><tspan dy="-3.8">&#8203;</tspan>O; makes most of the ATP</text><text x="30" y="588.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="900" fill="#2d3f4b">With O₂: up to about 32 ATP per glucose</text><text x="30" y="608.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#5a6478">(2.5 ATP per NADH, 1.5 per FADH₂,</text><text x="30" y="626.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#5a6478">plus 2 ATP and 2 GTP made directly).</text><text x="30" y="656.7" font-family="Nunito,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#9c3346">All 6 carbons leave as 6 CO₂.</text></svg>