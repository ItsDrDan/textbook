<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 782 592" width="782" height="592" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Where the body gets the carbon skeletons of nonessential amino acids. 3-Phosphoglycerate (glycolysis) gives serine, which gives glycine and, with sulfur from methionine, cysteine. Pyruvate (glycolysis) gives alanine by transamination (ALT). Oxaloacetate (citric acid cycle) gives aspartate by transamination (AST), and aspartate plus an amide N gives asparagine. Alpha-ketoglutarate (citric acid cycle) gives glutamate by transamination, which leads in further steps to glutamine, proline and arginine. Phenylalanine (essential, from food) gives tyrosine by adding an OH (O2, NADPH)."><title>Where the body gets the carbon skeletons of nonessential amino acids. 3-Phosphoglycerate (glycolysis) gives serine, which gives glycine and, with sulfur from methionine, cysteine. Pyruvate (glycolysis) gives alanine by transamination (ALT). Oxaloacetate (citric acid cycle) gives aspartate by transamination (AST), and aspartate plus an amide N gives asparagine. Alpha-ketoglutarate (citric acid cycle) gives glutamate by transamination, which leads in further steps to glutamine, proline and arginine. Phenylalanine (essential, from food) gives tyrosine by adding an OH (O2, NADPH).</title><rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><path d="M226.6 96.0 L352.5 96.0" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M352.5 96.0 L342.6 100.8 L342.6 91.2 Z" fill="#2d3f4b"/><path d="M429.5 89.8 L598.6 62.8" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M598.6 62.8 L589.5 69.1 L588.0 59.6 Z" fill="#2d3f4b"/><path d="M429.5 102.2 L551.5 121.7" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="