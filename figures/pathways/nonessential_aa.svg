.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(glycolysis)</text><rect x="55.5" y="263.0" width="171.0" height="50.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="141.0" y="284.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Oxaloacetate</text><text x="141.0" y="302.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(citric acid cycle)</text><rect x="55.5" y="359.0" width="171.0" height="50.0" rx="10" fill="#ffffff" stroke="#8fa6b8" stroke-width="2"/><text x="141.0" y="380.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">α-Ketoglutarate</text><text x="141.0" y="398.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3f4b" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(citric acid cycle)</text><rect x="43.8" y="455.0" width="194.5" height="50.0" rx="10" fill="#f3effd" stroke="#c9b8ea" stroke-width="2"/><text x="141.0" y="476.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Phenylalanine</text><text x="141.0" y="494.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4a3a73" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(essential, from food)</text><rect x="356.5" y="80.0" width="69.0" height="32.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="391.0" y="101.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Serine</text><rect x="602.6" y="40.0" width="76.9" height="32.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="641.0" y="61.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Glycine</text><rect x="555.5" y="111.0" width="171.0" height="50.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="641.0" y="132.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Cysteine</text><text x="641.0" y="150.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">(S from methionine)</text><rect x="352.6" y="176.0" width="76.9" height="32.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="391.0" y="197.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Alanine</text><rect x="344.7" y="272.0" width="92.6" height="32.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="391.0" y="293.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Aspartate</text><rect x="590.8" y="272.0" width="100.4" height="32.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="641.0" y="293.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Asparagine</text><rect x="344.7" y="368.0" width="92.6" height="32.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="391.0" y="389.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Glutamate</text><rect x="555.5" y="359.0" width="171.0" height="50.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="641.0" y="380.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Glutamine, proline,</text><text x="641.0" y="398.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">arginine</text><rect x="348.6" y="464.0" width="84.7" height="32.0" rx="10" fill="#e8f6ef" stroke="#a9d9c2" stroke-width="2"/><text x="391.0" y="485.0" text-anchor="middle" font-size="14" font-weight="800" fill="#23704f" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">Tyrosine</text><rect x="244.5" y="75.0" width="90.1" height="17.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="289.5" y="86.0" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">several steps</text><rect x="209.2" y="171.0" width="133.2" height="17.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="275.8" y="182.0" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">transamination (ALT)</text><rect x="219.0" y="267.0" width="133.2" height="17.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="285.6" y="278.0" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">transamination (AST)</text><rect x="481.3" y="267.0" width="65.4" height="17.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="514.0" y="278.0" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">+ amide N</text><rect x="237.5" y="363.0" width="96.2" height="17.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="285.6" y="374.0" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">transamination</text><rect x="451.4" y="363.0" width="90.1" height="17.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="496.4" y="374.0" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">further steps</text><rect x="239.2" y="459.0" width="108.6" height="17.0" rx="6" fill="#ffffff" fill-opacity="0.92"/><text x="293.4" y="470.0" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#3b5f7a" font-family="Nunito,Inter,Helvetica,Arial,sans-serif">+ OH (O₂, NADPH)</text></svg>