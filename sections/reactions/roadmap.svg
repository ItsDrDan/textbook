<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1112 432" width="1112" height="432" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-label="Reaction roadmap for organic families. Alkane plus X2 and light gives an alkyl halide; alkene plus HX gives an alkyl halide; alkene plus H2 (Pt or Ni) gives an alkane; burning in O2 gives CO2 and H2O. Alkene plus H2O and H+ gives an alcohol; an alcohol with H2SO4 and heat gives an alkene. Oxidation [O] of a 1° alcohol gives an aldehyde and of a 2° alcohol gives a ketone; H2 with Ni reduces them back to alcohols. An aldehyde plus an alcohol and H+ gives a hemiacetal, then an acetal; oxidation of an aldehyde gives a carboxylic acid. A carboxylic acid plus an alcohol and H+ gives an ester; H2O and H+ hydrolyze the ester; NaOH saponifies the ester to a carboxylate ion (salt); NaOH neutralizes the acid to the carboxylate. A carboxylic acid plus an amine and heat gives an amide; an amine plus HCl gives an ammonium ion (salt)."><title>Reaction roadmap for organic families. Alkane plus X2 and light gives an alkyl halide; alkene plus HX gives an alkyl halide; alkene plus H2 (Pt or Ni) gives an alkane; burning in O2 gives CO2 and H2O. Alkene plus H2O and H+ gives an alcohol; an alcohol with H2SO4 and heat gives an alkene. Oxidation [O] of a 1° alcohol gives an aldehyde and of a 2° alcohol gives a ketone; H2 with Ni reduces them back to alcohols. An aldehyde plus an alcohol and H+ gives a hemiacetal, then an acetal; oxidation of an aldehyde gives a carboxylic acid. A carboxylic acid plus an alcohol and H+ gives an ester; H2O and H+ hydrolyze the ester; NaOH saponifies the ester to a carboxylate ion (salt); NaOH neutralizes the acid to the carboxylate. A carboxylic acid plus an amine and heat gives an amide; an amine plus HCl gives an ammonium ion (salt).</title><rect x="1" y="1" width="1110" height="430" rx="14" fill="#ffffff" stroke="#e2dccd" stroke-width="2" stroke-dasharray="6 4"/><path d="M106.0 251.5